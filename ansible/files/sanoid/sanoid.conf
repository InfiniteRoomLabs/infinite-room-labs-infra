# Managed by Ansible -- do not edit manually
# Sanoid ZFS snapshot policy for Infinite Room Labs homelab
#
# Snapshots are local only. For offsite replication, configure
# syncoid separately.

[main]
  use_template = sacred_data
  recursive = no

[main/backups]
  use_template = service_data

[main/artifacts]
  use_template = service_data

[main/logs]
  use_template = logs

[main/ollama-models]
  use_template = large_assets

[main/gitea-lfs]
  use_template = service_data

[main/karakeep-data]
  # SQLite DB + archived pages -- authoritative, treat like service data
  use_template = service_data

[main/karakeep-meilisearch]
  # Search index -- rebuildable from karakeep-data, minimal retention
  use_template = large_assets

# ── Templates ────────────────────────────────────────────────────────

[template_sacred_data]
  # Personal collections -- conservative retention
  frequently = 0
  hourly = 0
  daily = 30
  weekly = 8
  monthly = 12
  yearly = 2
  autosnap = yes
  autoprune = yes

[template_service_data]
  # Service data (databases, repos, artifacts)
  frequently = 0
  hourly = 24
  daily = 30
  weekly = 4
  monthly = 6
  yearly = 0
  autosnap = yes
  autoprune = yes

[template_logs]
  # Logs -- short retention, they compress well
  frequently = 0
  hourly = 0
  daily = 14
  weekly = 4
  monthly = 0
  yearly = 0
  autosnap = yes
  autoprune = yes

[template_large_assets]
  # Large files (models, ISOs) -- minimal snapshots
  frequently = 0
  hourly = 0
  daily = 7
  weekly = 4
  monthly = 0
  yearly = 0
  autosnap = yes
  autoprune = yes
