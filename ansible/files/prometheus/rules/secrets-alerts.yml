groups:
  - name: secrets
    rules:
      - alert: SecretRotationOverdue
        expr: irl_secrets_rotation_overdue > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} secrets are past their rotation deadline"
          description: "Run bw-sync.sh --check-rotation to identify overdue secrets."

      - alert: SecretSyncStale
        expr: time() - irl_secrets_synced_timestamp_seconds > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Secrets sync has not run in over 24 hours"
          description: "Last sync was {{ $value | humanizeDuration }} ago. Check cron job or run bw-sync.sh --target both."
