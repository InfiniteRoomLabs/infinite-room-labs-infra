---
# playbooks/credentials-rotation.yml
# ====================================
# Moves exposed credentials out of the NFS share and flags them
# for rotation. The Internet Archive S3 credentials were found in
# plaintext at /media/root/storage1/nfs-share/IA_S3_CREDS.
#
# Run standalone:
#   ./run-ansible.sh playbook playbooks/credentials-rotation.yml

- name: Credential rotation and cleanup
  hosts: homelab
  become: true
  tags: [phase0, credentials]

  tasks:
    # ── Move IA S3 credentials off NFS share ───────────────────────
    - name: Check for IA S3 credentials on NFS share
      ansible.builtin.stat:
        path: /media/root/storage1/nfs-share/IA_S3_CREDS
      register: ia_creds

    - name: Move IA S3 credentials to /root (off NFS)
      ansible.builtin.command:
        cmd: mv /media/root/storage1/nfs-share/IA_S3_CREDS /root/.ia_s3_creds_ROTATE_THESE
      when: ia_creds.stat.exists
      changed_when: true

    - name: Restrict permissions on moved credentials
      ansible.builtin.file:
        path: /root/.ia_s3_creds_ROTATE_THESE
        owner: root
        group: root
        mode: "0600"
      when: ia_creds.stat.exists

    - name: Flag credentials for manual rotation
      ansible.builtin.debug:
        msg: >
          ACTION REQUIRED: Internet Archive S3 credentials have been moved
          to /root/.ia_s3_creds_ROTATE_THESE. Log in to archive.org and
          rotate these keys, then delete the file.
      when: ia_creds.stat.exists

    # ── Clean up NFS-exposed dotfiles ──────────────────────────────
    - name: Remove leftover dotfiles from NFS share
      ansible.builtin.file:
        path: "/media/root/storage1/nfs-share/{{ item }}"
        state: absent
      loop:
        - .aws
        - .docker
        - .ssh
        - .vim_runtime
      failed_when: false

    # ── Tighten NFS export permissions ─────────────────────────────
    # Parent nfs-share: broad access for the whole tree, all_squash to
    # nobody. Regex now requires trailing whitespace so it ONLY matches
    # the parent line, not the paperless-consume subdirectory below.
    - name: Configure NFS exports
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: '^/media/root/storage1/nfs-share\s'
        line: "/media/root/storage1/nfs-share {% for s in irl_nfs_allowed_subnets %}{{ s.cidr }}({{ s.mode }},sync,no_subtree_check,all_squash) {% endfor %}"
        backup: true
      notify: reload nfs

    # ── Paperless-ngx consume subdirectory ──────────────────────────
    # Dedicated sub-export so writes from the laptop's scanbridge land
    # as UID 1000 (matching the paperless container's fsGroup). The
    # parent nfs-share export above uses plain all_squash which maps to
    # nobody -- that breaks paperless's ability to delete files post-
    # ingestion. anonuid/anongid=1000 fixes that for just this subtree.
    - name: Ensure paperless-consume directory exists on NFS share
      ansible.builtin.file:
        path: "{{ irl_paperless_consume_path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0775"

    - name: Configure paperless-consume NFS sub-export
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: '^/media/root/storage1/nfs-share/paperless-consume\s'
        line: "{{ irl_paperless_consume_path }} {% for s in irl_nfs_allowed_subnets %}{{ s.cidr }}({{ s.mode }},sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000) {% endfor %}"
        backup: true
      notify: reload nfs

  handlers:
    - name: reload nfs
      ansible.builtin.command: exportfs -ra
      changed_when: true
