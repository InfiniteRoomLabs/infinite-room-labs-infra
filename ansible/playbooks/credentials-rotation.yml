---
# playbooks/credentials-rotation.yml
# ====================================
# Moves exposed credentials out of the NFS share and flags them
# for rotation. The Internet Archive S3 credentials were found in
# plaintext at /media/root/storage1/nfs-share/IA_S3_CREDS.
#
# Run standalone:
#   ./run-ansible.sh playbook playbooks/credentials-rotation.yml

- name: Credential rotation and cleanup
  hosts: homelab
  become: true
  tags: [phase0, credentials]

  tasks:
    # ── Move IA S3 credentials off NFS share ───────────────────────
    - name: Check for IA S3 credentials on NFS share
      ansible.builtin.stat:
        path: /media/root/storage1/nfs-share/IA_S3_CREDS
      register: ia_creds

    - name: Move IA S3 credentials to /root (off NFS)
      ansible.builtin.command:
        cmd: mv /media/root/storage1/nfs-share/IA_S3_CREDS /root/.ia_s3_creds_ROTATE_THESE
      when: ia_creds.stat.exists
      changed_when: true

    - name: Restrict permissions on moved credentials
      ansible.builtin.file:
        path: /root/.ia_s3_creds_ROTATE_THESE
        owner: root
        group: root
        mode: "0600"
      when: ia_creds.stat.exists

    - name: Flag credentials for manual rotation
      ansible.builtin.debug:
        msg: >
          ACTION REQUIRED: Internet Archive S3 credentials have been moved
          to /root/.ia_s3_creds_ROTATE_THESE. Log in to archive.org and
          rotate these keys, then delete the file.
      when: ia_creds.stat.exists

    # ── Clean up NFS-exposed dotfiles ──────────────────────────────
    - name: Remove leftover dotfiles from NFS share
      ansible.builtin.file:
        path: "/media/root/storage1/nfs-share/{{ item }}"
        state: absent
      loop:
        - .aws
        - .docker
        - .ssh
        - .vim_runtime
      failed_when: false

    # ── Tighten NFS export permissions ─────────────────────────────
    # Parent nfs-share: broad access for the whole tree. all_squash maps
    # every NFS client write to a single uid/gid -- we set that to 1000
    # so writes land as the same uid the paperless container uses (and
    # the same uid as wes on both the laptop and the homelab). Without
    # anonuid/anongid the squash target defaults to `nobody` which
    # breaks anything trying to read its own writes back through a
    # different mount path (paperless container reading scans from
    # hostPath, etc).
    - name: Configure NFS exports
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: '^/media/root/storage1/nfs-share\s'
        line: "/media/root/storage1/nfs-share {% for s in irl_nfs_allowed_subnets %}{{ s.cidr }}({{ s.mode }},sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000) {% endfor %}"
        backup: true
      notify: reload nfs

    # ── Paperless-ngx consume subdirectory ──────────────────────────
    # The paperless container expects /usr/src/paperless/consume to be
    # writable by uid 1000. Pre-create the directory with the right
    # ownership so the first scanbridge drop doesn't hit a permission
    # wall. Sub-export below is mostly redundant with the parent (the
    # parent already has anonuid=1000 set) but we keep it documented as
    # a marker -- if the parent ever stops using anonuid this is the
    # sub-tree that absolutely needs it.
    - name: Ensure paperless-consume directory exists on NFS share
      ansible.builtin.file:
        path: "{{ irl_paperless_consume_path }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0775"

    - name: Configure paperless-consume NFS sub-export
      ansible.builtin.lineinfile:
        path: /etc/exports
        regexp: '^/media/root/storage1/nfs-share/paperless-consume\s'
        line: "{{ irl_paperless_consume_path }} {% for s in irl_nfs_allowed_subnets %}{{ s.cidr }}({{ s.mode }},sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000) {% endfor %}"
        backup: true
      notify: reload nfs

  handlers:
    - name: reload nfs
      ansible.builtin.command: exportfs -ra
      changed_when: true
