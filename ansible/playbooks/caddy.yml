---
# playbooks/caddy.yml
# ====================
# Installs Caddy as a bare-metal reverse proxy via APT.
# Caddy is the ONLY service that runs bare-metal (not containerized).
# It binds to the Tailscale interface for zero-trust access.
#
# Run standalone:
#   ./run-ansible.sh playbook playbooks/caddy.yml

- name: Caddy reverse proxy
  hosts: homelab
  become: true
  tags: [phase1, caddy]

  tasks:
    # ── Install Caddy ──────────────────────────────────────────────
    - name: Install prerequisites for Caddy APT repo
      ansible.builtin.apt:
        name:
          - debian-keyring
          - debian-archive-keyring
          - apt-transport-https
          - curl
        state: present
        update_cache: true

    - name: Add Caddy GPG key
      ansible.builtin.apt_key:
        url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key"
        keyring: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        state: present

    - name: Add Caddy APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        filename: caddy-stable
        state: present

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true

    # ── Deploy Caddyfile ───────────────────────────────────────────
    - name: Ensure Caddy config directory exists
      ansible.builtin.file:
        path: /etc/caddy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure Caddy log directory exists with correct ownership
      ansible.builtin.file:
        path: /var/log/caddy
        state: directory
        owner: caddy
        group: caddy
        mode: "0755"
        recurse: true

    - name: Deploy Caddyfile
      ansible.builtin.template:
        src: ../templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: reload caddy

    # ── Enable and start ───────────────────────────────────────────
    - name: Enable and start Caddy
      ansible.builtin.systemd:
        name: caddy
        state: started
        enabled: true

  handlers:
    - name: reload caddy
      ansible.builtin.systemd:
        name: caddy
        state: restarted
