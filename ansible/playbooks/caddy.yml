---
# playbooks/caddy.yml
# ====================
# Retirement playbook: stops and disables the bare-metal Caddy service.
# Caddy now runs in-cluster as a k8s Deployment (irl-caddy chart).
# Deployed via helm-deploy.yml --tags caddy.
#
# Run standalone to decommission bare-metal Caddy:
#   uv run ansible-playbook playbooks/caddy.yml

- name: Caddy bare-metal retirement
  hosts: homelab
  become: true
  tags: [caddy-retire]

  tasks:
    - name: Stop and disable Caddy systemd service
      ansible.builtin.systemd:
        name: caddy
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Remove Caddy APT package
      ansible.builtin.apt:
        name: caddy
        state: absent

    - name: Remove Caddy APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        filename: caddy-stable
        state: absent
      ignore_errors: true

    - name: Note about bare-metal Caddyfile backup
      ansible.builtin.debug:
        msg: >
          Bare-metal Caddyfile backup at /etc/caddy/Caddyfile.bare-metal.backup.
          Caddy now runs as a k8s pod (irl-caddy chart, hostNetwork).
          Deploy via: uv run ansible-playbook playbooks/helm-deploy.yml --tags caddy
