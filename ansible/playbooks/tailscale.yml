---
# playbooks/tailscale.yml
# ========================
# Installs and configures Tailscale mesh network on the homelab server.
# After this playbook runs, the server is accessible via Tailscale IP
# and the inventory should be updated to use it.
#
# Prerequisites:
# - Tailscale account exists
# - Operator will need to authenticate interactively on first run
#
# Run standalone:
#   ./run-ansible.sh playbook playbooks/tailscale.yml

- name: Tailscale mesh network
  hosts: homelab
  become: true
  tags: [phase1, tailscale]

  tasks:
    # ── Install Tailscale ──────────────────────────────────────────
    - name: Check if Tailscale is already installed
      ansible.builtin.command: which tailscale
      register: tailscale_check
      changed_when: false
      failed_when: false

    # The keyring is a plain file download, not apt_key (deprecated, and it
    # used to hardcode bookworm). The release name follows the host so the
    # same play is correct across Debian upgrades (bookworm -> trixie, ...).
    - name: Add Tailscale signing key (keyring file, not apt_key)
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"
      when: tailscale_check.rc != 0

    - name: Add Tailscale APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main"
        filename: tailscale
        state: present
      when: tailscale_check.rc != 0

    - name: Install Tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true
      when: tailscale_check.rc != 0

    # ── Enable IP forwarding (required for exit node) ───────────────
    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Enable IPv6 forwarding
      ansible.posix.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    # ── Configure Tailscale ────────────────────────────────────────
    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        state: started
        enabled: true

    - name: Check Tailscale status
      ansible.builtin.command: tailscale status --json
      register: ts_status
      changed_when: false
      failed_when: false

    - name: Bring Tailscale up with hostname and exit node
      ansible.builtin.command: >
        tailscale up
        --hostname={{ irl_tailscale_hostname }}
        --accept-dns
        --advertise-exit-node
      when: >
        ts_status.rc != 0 or
        (ts_status.stdout | from_json).BackendState != "Running"
      changed_when: true
      register: ts_up

    - name: Display Tailscale IP
      ansible.builtin.command: tailscale ip -4
      register: ts_ip
      changed_when: false

    - name: Report Tailscale status
      ansible.builtin.debug:
        msg: >
          Tailscale is running. Server Tailscale IPv4: {{ ts_ip.stdout }}.
          Update inventory/hosts.ini with this IP for future runs.
