---
# playbooks/plane.yml
# ====================
# Deploys Plane (project management) as a Docker Compose stack.
# Plane has its own Redis and MinIO instances in addition to using
# the shared PostgreSQL.
#
# Run standalone:
#   ./run-ansible.sh playbook playbooks/plane.yml

- name: Plane project management
  hosts: homelab
  become: true
  tags: [phase3, plane]

  tasks:
    - name: Create Plane stack directory
      ansible.builtin.file:
        path: "{{ irl_compose_base }}/plane"
        state: directory
        owner: root
        group: docker
        mode: "0750"

    - name: Deploy Plane compose file
      ansible.builtin.template:
        src: ../templates/compose/plane/docker-compose.yml.j2
        dest: "{{ irl_compose_base }}/plane/docker-compose.yml"
        owner: root
        group: docker
        mode: "0640"
        backup: true

    - name: Wait for PostgreSQL to be reachable
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5433
        timeout: 60

    - name: Start Plane stack
      community.docker.docker_compose_v2:
        project_src: "{{ irl_compose_base }}/plane"
        state: present
        pull: "always"

    - name: Display Plane post-deploy instructions
      ansible.builtin.debug:
        msg: |
          Plane is starting up. It may take 2-3 minutes for all services.
          Access at https://plane.{{ irl_public_domain }}

          First-time setup:
          1. Navigate to the web UI
          2. Create admin account
          3. Create the "Infinite Room Labs" workspace
