---
# playbooks/k8s-secrets.yml
# ===========================
# Provisions Kubernetes Secrets in the irl namespace from Ansible Vault vars.
#
# This is the bridge between Ansible Vault (bootstrap) and Kubernetes.
# Helm values files reference these secret names via existingSecret fields
# rather than embedding secret values in values.yaml.
#
# Run standalone:
#   ./run-ansible.sh playbook playbooks/k8s-secrets.yml
#
# Must run AFTER k3s.yml and BEFORE helm-deploy.yml.

- name: Kubernetes Secrets provisioning
  hosts: homelab
  become: true
  tags: [phase2, k8s-secrets]

  vars:
    k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
    k3s_namespace: irl

  tasks:
    # ── PostgreSQL secrets ─────────────────────────────────────────
    - name: Create PostgreSQL superuser secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-superuser
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            password: "{{ vault_pg_superuser_password }}"
            postgres-password: "{{ vault_pg_superuser_password }}"
      no_log: true

    - name: Create PostgreSQL per-database secrets
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "postgres-{{ item.key }}"
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            password: "{{ item.value }}"
      loop: "{{ vault_pg_passwords | dict2items }}"
      no_log: true

    # ── Redis secret ───────────────────────────────────────────────
    - name: Create Redis secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: redis-auth
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            redis-password: "{{ vault_redis_password }}"
      no_log: true

    # ── Gitea secrets ──────────────────────────────────────────────
    - name: Create Gitea admin secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gitea-admin
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            password: "{{ vault_gitea_admin_password }}"
            username: admin
      no_log: true

    # ── Authentik secrets ──────────────────────────────────────────
    - name: Create Authentik secrets
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: authentik-bootstrap
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            bootstrap-password: "{{ vault_authentik_bootstrap_password }}"
            secret-key: "{{ vault_authentik_secret_key }}"
      no_log: true

    # ── Grafana secrets ────────────────────────────────────────────
    - name: Create Grafana admin secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            admin-user: admin
            admin-password: "{{ vault_grafana_admin_password }}"
      no_log: true

    # ── Plane secrets ──────────────────────────────────────────────
    - name: Create Plane secrets
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: plane-secrets
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            secret-key: "{{ vault_plane_secret_key }}"
            minio-root-password: "{{ vault_plane_minio_password }}"
      no_log: true

    - name: Display secrets summary
      ansible.builtin.debug:
        msg: |
          Kubernetes Secrets provisioned in namespace {{ k3s_namespace }}:
            - postgres-superuser
            - postgres-{gitea,plane,vault,authentik,grafana}
            - redis-auth
            - gitea-admin
            - authentik-bootstrap
            - grafana-admin
            - plane-secrets
          All values sourced from Ansible Vault (vault.yml). No secrets in values files.
