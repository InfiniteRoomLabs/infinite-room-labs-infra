---
# playbooks/k8s-secrets.yml
# ===========================
# Provisions Kubernetes Secrets in the irl namespace from Ansible Vault vars.
#
# This is the bridge between Ansible Vault (bootstrap) and Kubernetes.
# Helm values files reference these secret names via existingSecret fields
# rather than embedding secret values in values.yaml.
#
# Run standalone:
#   ./run-ansible.sh playbook playbooks/k8s-secrets.yml
#
# Must run AFTER k3s.yml and BEFORE helm-deploy.yml.

- name: Kubernetes Secrets provisioning
  hosts: homelab
  become: true
  tags: [phase2, k8s-secrets]

  vars:
    k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
    k3s_namespace: irl

  tasks:
    # ── PostgreSQL secrets ─────────────────────────────────────────
    - name: Create PostgreSQL superuser secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-superuser
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            password: "{{ vault_pg_superuser_password }}"
            postgres-password: "{{ vault_pg_superuser_password }}"
      no_log: true

    - name: Create PostgreSQL per-database secrets
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "postgres-{{ item.key }}"
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            password: "{{ item.value }}"
      loop: "{{ vault_pg_passwords | dict2items }}"
      no_log: true

    # ── Redis secret ───────────────────────────────────────────────
    - name: Create Redis secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: redis-auth
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            redis-password: "{{ vault_redis_password }}"
      no_log: true

    # ── Gitea secrets ──────────────────────────────────────────────
    - name: Create Gitea admin secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gitea-admin
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            password: "{{ vault_gitea_admin_password }}"
            username: admin
      no_log: true

    # ── Authentik secrets ──────────────────────────────────────────
    - name: Create Authentik secrets
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: authentik-bootstrap
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            bootstrap-password: "{{ vault_authentik_bootstrap_password }}"
            secret-key: "{{ vault_authentik_secret_key }}"
      no_log: true

    # ── Vaultwarden secrets ─────────────────────────────────────────
    - name: Create Vaultwarden admin token secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: vaultwarden-admin
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            admin-token: "{{ vault_vaultwarden_admin_token }}"
      no_log: true

    # ── SendGrid secrets ─────────────────────────────────────────
    - name: Create SendGrid credentials secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sendgrid-credentials
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            api-key: "{{ vault_sendgrid_api_key }}"
            mail-send-key: "{{ vault_sendgrid_mail_send_key }}"
      no_log: true

    # ── Vaultwarden SMTP secret ──────────────────────────────────
    # The guerzon chart uses the release-named secret for SMTP fields
    - name: Create Vaultwarden SMTP secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: vaultwarden
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            SMTP_USERNAME: "apikey"
            mail-send-key: "{{ vault_sendgrid_mail_send_key }}"
      no_log: true

    # ── Grafana secrets ────────────────────────────────────────────
    - name: Create Grafana admin secret
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            admin-user: admin
            admin-password: "{{ vault_grafana_admin_password }}"
      no_log: true

    # ── Paperless-ngx secrets ──────────────────────────────────────
    # postgres-paperless is auto-created by the vault_pg_passwords loop above.
    # paperless-secrets bundles the Django SECRET_KEY, bootstrap admin password,
    # and the Authentik OIDC JSON blob (added later, guarded by when:).
    # paperless-oidc and paperless-backup-s3 are pending -- see the TODO block
    # in scripts/bw-sync-config.yaml for the sequencing.
    - name: Create Paperless secrets
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: paperless-secrets
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData: >-
            {{
              {'secret-key': vault_paperless_secret_key,
               'admin-password': vault_paperless_admin_password}
              | combine(
                  {'PAPERLESS_SOCIALACCOUNT_PROVIDERS': vault_paperless_socialaccount_providers_json}
                  if vault_paperless_socialaccount_providers_json is defined
                  else {}
                )
            }}
      when: vault_paperless_secret_key is defined
      no_log: true

    - name: Create Paperless OIDC client secret (pending -- Authentik UI setup)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: paperless-oidc
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            client-id: "{{ vault_paperless_oidc_client_id }}"
            client-secret: "{{ vault_paperless_oidc_client_secret }}"
      when:
        - vault_paperless_oidc_client_id is defined
        - vault_paperless_oidc_client_secret is defined
      no_log: true

    - name: Create Paperless backup S3 credentials (pending -- Garage IAM setup)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ k3s_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: paperless-backup-s3
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            AWS_ACCESS_KEY_ID: "{{ vault_paperless_backup_s3_access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ vault_paperless_backup_s3_secret_key }}"
      when:
        - vault_paperless_backup_s3_access_key is defined
        - vault_paperless_backup_s3_secret_key is defined
      no_log: true

    - name: Display secrets summary
      ansible.builtin.debug:
        msg: |
          Kubernetes Secrets provisioned in namespace {{ k3s_namespace }}:
            - postgres-superuser
            - postgres-{gitea,vault,authentik,grafana,vaultwarden,paperless}
            - redis-auth
            - gitea-admin
            - vaultwarden-admin
            - authentik-bootstrap
            - grafana-admin
            - paperless-secrets (conditional -- present once vault_paperless_* is synced)
            - paperless-oidc, paperless-backup-s3 (conditional -- pending manual setup)
          All values sourced from Ansible Vault (vault.yml). No secrets in values files.
