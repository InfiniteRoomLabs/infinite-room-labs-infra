---
# playbooks/zfs.yml
# ==================
# Creates ZFS datasets for service data, configures atime=off,
# schedules scrubs, and sets up sanoid for automated snapshots.
#
# IMPORTANT: This playbook does NOT touch existing data or datasets.
# It only creates new datasets and configures pool-level properties.
#
# Run standalone:
#   ./run-ansible.sh playbook playbooks/zfs.yml

- name: ZFS datasets and snapshots
  hosts: homelab
  become: true
  tags: [phase1, zfs]

  tasks:
    # ── ARC memory cap ─────────────────────────────────────────────
    # ZFS ARC defaults to 50% of RAM which looks alarming in htop
    # and steals headroom from k8s pods. Cap it explicitly.
    - name: Set ZFS ARC max (persistent across reboots)
      ansible.builtin.copy:
        content: "options zfs zfs_arc_max={{ irl_zfs_arc_max_gb * 1024 * 1024 * 1024 }}\n"
        dest: /etc/modprobe.d/zfs.conf
        owner: root
        group: root
        mode: "0644"

    - name: Apply ZFS ARC max immediately (no reboot needed)
      ansible.builtin.shell:
        cmd: "echo {{ irl_zfs_arc_max_gb * 1024 * 1024 * 1024 }} > /sys/module/zfs/parameters/zfs_arc_max"
      changed_when: true

    # ── Pool-level optimizations ───────────────────────────────────
    - name: Disable atime on ZFS pool (reduces unnecessary writes)
      community.general.zfs:
        name: "{{ irl_zfs_pool }}"
        state: present
        extra_zfs_properties:
          atime: "off"

    # ── Create service datasets ────────────────────────────────────
    - name: Create ZFS datasets for services
      community.general.zfs:
        name: "{{ item.name }}"
        state: present
        extra_zfs_properties: >-
          {{
            {'mountpoint': item.mountpoint, 'quota': item.quota, 'compression': 'lz4', 'atime': 'off'}
            | combine(item.properties | default({}))
          }}
      loop: "{{ irl_zfs_datasets }}"

    # ── Per-dataset ownership for containerized services ──────────
    # Paperless-ngx runs as UID/GID 1000 inside its pod. ZFS datasets are
    # created root-owned by default, which silently breaks the pod's
    # hostPath mounts. Chown is idempotent and cheap.
    #
    # paperless-consume is NOT listed here -- it lives under the existing
    # nfs-share and is handled by credentials-rotation.yml (which also
    # owns the NFS export line for that subdir).
    - name: Chown paperless datasets to UID 1000 (container user)
      ansible.builtin.file:
        path: "{{ irl_zfs_mount }}/{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        recurse: true
      loop:
        - paperless-media
        - paperless-data
      tags: [paperless]

    # Meilisearch (karakeep search index) runs as UID/GID 1000 with an
    # fsGroup that does not apply to hostPath PVs -- chown explicitly.
    # karakeep-data is NOT listed: the karakeep container runs as root.
    - name: Chown karakeep-meilisearch dataset to UID 1000 (container user)
      ansible.builtin.file:
        path: "{{ irl_zfs_mount }}/karakeep-meilisearch"
        state: directory
        owner: "1000"
        group: "1000"
        recurse: true
      tags: [karakeep]

    # Satisfactory server runs as PUID/PGID 1000. fsGroup does not apply to
    # hostPath PVs, so this chown is what actually makes /config writable.
    - name: Chown satisfactory-config dataset to UID 1000 (container user)
      ansible.builtin.file:
        path: "{{ irl_zfs_mount }}/satisfactory-config"
        state: directory
        owner: "1000"
        group: "1000"
        recurse: true
      tags: [satisfactory]

    # ── ZFS scrub schedule ─────────────────────────────────────────
    - name: Schedule weekly ZFS scrub (Sunday 3am)
      ansible.builtin.cron:
        name: "ZFS weekly scrub - {{ irl_zfs_pool }}"
        minute: "0"
        hour: "3"
        weekday: "0"
        job: "/sbin/zpool scrub {{ irl_zfs_pool }}"
        user: root

    # ── Sanoid snapshot automation ─────────────────────────────────
    - name: Install sanoid for ZFS snapshot automation
      ansible.builtin.apt:
        name: sanoid
        state: present
        update_cache: true

    - name: Ensure sanoid config directory exists
      ansible.builtin.file:
        path: /etc/sanoid
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy sanoid configuration
      ansible.builtin.copy:
        src: ../files/sanoid/sanoid.conf
        dest: /etc/sanoid/sanoid.conf
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Enable sanoid timer
      ansible.builtin.systemd:
        name: sanoid.timer
        state: started
        enabled: true

    # ── Trigger immediate scrub if overdue ─────────────────────────
    - name: Check last scrub date
      ansible.builtin.command: "zpool status {{ irl_zfs_pool }}"
      register: zpool_status
      changed_when: false

    - name: Start ZFS scrub if overdue (non-blocking)
      ansible.builtin.command: "zpool scrub {{ irl_zfs_pool }}"
      when: "'scrub in progress' not in zpool_status.stdout"
      changed_when: true
      async: 86400
      poll: 0
