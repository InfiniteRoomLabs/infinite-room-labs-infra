---
# playbooks/helm-deploy.yml
# ==========================
# Deploys all IRL services to k3s using Helm charts.
#
# Charts are sourced from:
#   - IRL helm-charts repo (irl-postgres, irl-valkey, irl-gitea, irl-monitoring)
#   - Upstream repos (vault, authentik, jenkins, plane, ollama)
#
# Prerequisites:
#   - k3s.yml complete (cluster running, namespace created, PVs created)
#   - k8s-secrets.yml complete (Kubernetes Secrets provisioned)
#   - IRL helm-charts repo cloned at ~/projects/infinite-room-labs/helm-charts
#
# Run full deploy:
#   ./run-ansible.sh playbook playbooks/helm-deploy.yml
#
# Run a single service:
#   ./run-ansible.sh playbook playbooks/helm-deploy.yml --tags postgres

- name: Helm chart deployment for all IRL services
  hosts: homelab
  become: true
  tags: [helm]

  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    k3s_namespace: irl
    irl_charts_path: "/home/{{ irl_admin_user }}/helm-charts/charts"
    helm_values_path: "/home/{{ irl_admin_user }}/helm-values"

  tasks:
    # ── Sync IRL helm-charts repo to server ──────────────────────
    - name: Clone or update IRL helm-charts repo
      ansible.builtin.git:
        repo: "https://github.com/InfiniteRoomLabs/helm-charts.git"
        dest: "/home/{{ irl_admin_user }}/helm-charts"
        version: main
        force: true
      become_user: "{{ irl_admin_user }}"
      tags: [always]

    - name: Build chart dependencies
      ansible.builtin.command:
        cmd: helm dependency update
        chdir: "{{ irl_charts_path }}/{{ item }}"
      loop:
        - irl-postgres
        - irl-valkey
        - irl-gitea
        - irl-monitoring
        - irl-garage
        - irl-openviking
      changed_when: true
      tags: [always]

    # ── Upload values override files to server ───────────────────
    - name: Create values override directories
      ansible.builtin.file:
        path: "{{ helm_values_path }}/{{ item }}"
        state: directory
        owner: "{{ irl_admin_user }}"
        group: "{{ irl_admin_user }}"
        mode: "0750"
      loop:
        - ""
        - vault
        - plane
        - ollama
        - coredns
        - homepage
      tags: [always]

    # ── Add upstream Helm repos (for non-IRL charts) ─────────────
    - name: Add upstream Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - { name: hashicorp, url: "https://helm.releases.hashicorp.com" }
        - { name: cnpg, url: "https://cloudnative-pg.github.io/charts" }
        - { name: goauthentik, url: "https://charts.goauthentik.io" }
        - { name: makeplane, url: "https://helm.plane.so/" }
        - { name: jenkins, url: "https://charts.jenkins.io" }
        - { name: ollama-helm, url: "https://otwld.github.io/ollama-helm/" }
      tags: [always]

    - name: Update Helm repo cache
      ansible.builtin.command: helm repo update
      changed_when: false
      tags: [always]

    # ══════════════════════════════════════════════════════════════
    # Phase 2: Core Data
    # ══════════════════════════════════════════════════════════════

    - name: "Phase 2: Install CNPG operator"
      kubernetes.core.helm:
        name: cnpg-operator
        chart_ref: cnpg/cloudnative-pg
        release_namespace: cnpg-system
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, postgres]

    - name: "Phase 2: Deploy PostgreSQL (irl-postgres chart)"
      kubernetes.core.helm:
        name: postgresql
        chart_ref: "{{ irl_charts_path }}/irl-postgres"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: false
        timeout: "5m0s"
        values:
          operator:
            enabled: false
          cluster:
            storage:
              storageClass: local-path
            nodePort: 30432
      tags: [phase2, postgres]

    - name: "Phase 2: Wait for CNPG cluster healthy"
      ansible.builtin.command: >
        kubectl get cluster postgresql -n {{ k3s_namespace }}
        -o jsonpath='{.status.phase}' --kubeconfig {{ kubeconfig }}
      register: cnpg_status
      until: "'Cluster in healthy state' in cnpg_status.stdout"
      retries: 60
      delay: 5
      changed_when: false
      tags: [phase2, postgres]

    - name: "Phase 2: Create service databases"
      kubernetes.core.k8s_exec:
        namespace: "{{ k3s_namespace }}"
        pod: "postgresql-1"
        container: postgres
        kubeconfig: "{{ kubeconfig }}"
        command: >
          psql -U postgres -c "
            DO $$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ item.name }}') THEN
                CREATE USER {{ item.name }} WITH PASSWORD '{{ vault_pg_passwords[item.name] }}';
              END IF;
            END $$;
            SELECT 'exists' FROM pg_database WHERE datname='{{ item.name }}';"
      loop: "{{ irl_pg_databases }}"
      no_log: true
      register: db_check
      tags: [phase2, postgres]

    - name: "Phase 2: Create databases (if not exist)"
      kubernetes.core.k8s_exec:
        namespace: "{{ k3s_namespace }}"
        pod: "postgresql-1"
        container: postgres
        kubeconfig: "{{ kubeconfig }}"
        command: >
          psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='{{ item.name }}'"
      loop: "{{ irl_pg_databases }}"
      register: db_exists
      changed_when: false
      tags: [phase2, postgres]

    - name: "Phase 2: Create missing databases"
      kubernetes.core.k8s_exec:
        namespace: "{{ k3s_namespace }}"
        pod: "postgresql-1"
        container: postgres
        kubeconfig: "{{ kubeconfig }}"
        command: >
          psql -U postgres -c "CREATE DATABASE {{ item.item.name }} OWNER {{ item.item.name }}"
      loop: "{{ db_exists.results }}"
      when: "'1' not in item.stdout"
      tags: [phase2, postgres]

    - name: "Phase 2: Deploy Valkey (irl-valkey chart)"
      kubernetes.core.helm:
        name: valkey
        chart_ref: "{{ irl_charts_path }}/irl-valkey"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, valkey]

    # ── Garage S3 Object Storage ──────────────────────────────────

    # ── Internal DNS (CoreDNS for Tailscale Split DNS) ───────────
    # Serves lab.infiniteroomlabs.cloud and internal.infiniteroomlabs.cloud
    # zones. Records generated from irl_services dict.

    - name: "Phase 2: Add CoreDNS Helm repo"
      kubernetes.core.helm_repository:
        name: coredns
        repo_url: "https://coredns.github.io/helm"
      tags: [phase2, coredns]

    - name: "Phase 2: Template internal DNS zone file"
      ansible.builtin.template:
        src: ../templates/coredns-internal-zone.db.j2
        dest: "{{ helm_values_path }}/coredns-zone.db"
        owner: "{{ irl_admin_user }}"
        mode: "0644"
      vars:
        homelab_tailscale_ip: "100.86.213.22"
      tags: [phase2, coredns]

    - name: "Phase 2: Read zone file from server"
      ansible.builtin.slurp:
        src: "{{ helm_values_path }}/coredns-zone.db"
      register: zone_file_content
      tags: [phase2, coredns]

    - name: "Phase 2: Create CoreDNS zone ConfigMap"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: coredns-internal-zones
            namespace: "{{ k3s_namespace }}"
          data:
            lab.infiniteroomlabs.cloud.db: "{{ zone_file_content.content | b64decode }}"
      tags: [phase2, coredns]

    - name: "Phase 2: Upload CoreDNS values"
      ansible.builtin.copy:
        src: ../helm/coredns/values.yaml
        dest: "{{ helm_values_path }}/coredns/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase2, coredns]

    - name: "Phase 2: Deploy internal CoreDNS"
      kubernetes.core.helm:
        name: coredns-internal
        chart_ref: coredns/coredns
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/coredns/values.yaml"
        wait: true
        timeout: "3m0s"
      tags: [phase2, coredns]

    - name: "Phase 2: Create Garage data PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: garage-data-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "500Gi"
            selector:
              matchLabels:
                app: garage
      tags: [phase2, garage]

    - name: "Phase 2: Create Garage meta PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: garage-meta-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "5Gi"
            selector:
              matchLabels:
                app: garage
      tags: [phase2, garage]

    - name: "Phase 2: Create Garage secrets"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData: "{{ item.data }}"
      loop:
        - name: garage-rpc-secret
          data:
            rpc-secret: "{{ vault_garage_rpc_secret }}"
        - name: garage-admin-secret
          data:
            admin-token: "{{ vault_garage_admin_token }}"
            metrics-token: "{{ vault_garage_metrics_token }}"
      no_log: true
      tags: [phase2, garage]

    - name: "Phase 2: Deploy Garage (irl-garage chart)"
      kubernetes.core.helm:
        name: garage
        chart_ref: "{{ irl_charts_path }}/irl-garage"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, garage]

    # ── OpenViking Context Database ────────────────────────────────

    - name: "Phase 2: Create OpenViking data PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: openviking-data-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "20Gi"
            selector:
              matchLabels:
                app: openviking
      tags: [phase2, openviking]

    - name: "Phase 2: Create OpenViking API key secret"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openviking-api-key
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            root-api-key: "{{ vault_openviking_api_key }}"
      no_log: true
      tags: [phase2, openviking]

    - name: "Phase 2: Deploy OpenViking (irl-openviking chart)"
      kubernetes.core.helm:
        name: openviking
        chart_ref: "{{ irl_charts_path }}/irl-openviking"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, openviking]

    - name: "Phase 2: Upload Vault values file"
      ansible.builtin.copy:
        src: ../helm/vault/values.yaml
        dest: "{{ helm_values_path }}/vault/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase2, vault]

    - name: "Phase 2: Deploy Vault"
      kubernetes.core.helm:
        name: vault
        chart_ref: hashicorp/vault
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_path }}/vault/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        timeout: "3m0s"
      tags: [phase2, vault]

    - name: "Phase 2: Display Vault init instructions"
      ansible.builtin.debug:
        msg: |
          Vault is running but NOT initialized.

          To initialize:
            kubectl exec -n irl vault-0 -- vault operator init -key-shares=5 -key-threshold=3

          To unseal (run 3x with different keys):
            kubectl exec -n irl vault-0 -- vault operator unseal

          See docs/runbooks/vault-sealed.md for the full procedure.
      tags: [phase2, vault]

    # ══════════════════════════════════════════════════════════════
    # Phase 3: Dev Platform + Monitoring
    # ══════════════════════════════════════════════════════════════

    - name: "Phase 3: Write Gitea secrets override"
      ansible.builtin.copy:
        content: |
          gitea:
            gitea:
              config:
                database:
                  PASSWD: "{{ vault_pg_passwords.gitea }}"
                cache:
                  HOST: "redis://:{{ vault_redis_password }}@valkey:6379/0"
                session:
                  PROVIDER_CONFIG: "redis://:{{ vault_redis_password }}@valkey:6379/1"
                queue:
                  CONN_STR: "redis://:{{ vault_redis_password }}@valkey:6379/2"
        dest: "{{ helm_values_path }}/gitea-secrets.yaml"
        owner: root
        mode: "0600"
      no_log: true
      tags: [phase3, gitea]

    - name: "Phase 3: Deploy Gitea (irl-gitea chart)"
      kubernetes.core.helm:
        name: gitea
        chart_ref: "{{ irl_charts_path }}/irl-gitea"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/gitea-secrets.yaml"
        wait: true
        timeout: "5m0s"
      tags: [phase3, gitea]

    - name: "Phase 3: Write Authentik secrets override"
      ansible.builtin.copy:
        content: |
          authentik:
            secret_key: "{{ vault_authentik_secret_key }}"
            postgresql:
              host: "postgresql-rw"
              name: "authentik"
              user: "authentik"
              password: "{{ vault_pg_passwords.authentik }}"
            redis:
              host: "valkey"
              password: "{{ vault_redis_password }}"
            bootstrap_password: "{{ vault_authentik_bootstrap_password }}"
          server:
            service:
              type: NodePort
              nodePort: 30900
            resources:
              limits:
                memory: "1536Mi"
              requests:
                memory: "512Mi"
          worker:
            resources:
              limits:
                memory: "768Mi"
              requests:
                memory: "128Mi"
          postgresql:
            enabled: false
          redis:
            enabled: false
        dest: "{{ helm_values_path }}/authentik-values.yaml"
        owner: root
        mode: "0600"
      no_log: true
      tags: [phase3, authentik]

    - name: "Phase 3: Deploy Authentik SSO"
      kubernetes.core.helm:
        name: authentik
        chart_ref: goauthentik/authentik
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/authentik-values.yaml"
        wait: true
        timeout: "5m0s"
      tags: [phase3, authentik]

    - name: "Phase 3: Deploy monitoring (irl-monitoring chart)"
      kubernetes.core.helm:
        name: monitoring
        chart_ref: "{{ irl_charts_path }}/irl-monitoring"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values:
          kube-prometheus-stack:
            grafana:
              adminPassword: "{{ vault_grafana_admin_password }}"
        wait: true
        timeout: "10m0s"
      no_log: true
      tags: [phase3, monitoring]

    # ── Homepage Dashboard ─────────────────────────────────────────

    - name: "Phase 3: Add Homepage Helm repo"
      kubernetes.core.helm_repository:
        name: jameswynn
        repo_url: "https://jameswynn.github.io/helm-charts"
      tags: [phase3, homepage]

    - name: "Phase 3: Upload Homepage values"
      ansible.builtin.copy:
        src: ../helm/homepage/values.yaml
        dest: "{{ helm_values_path }}/homepage/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, homepage]

    - name: "Phase 3: Deploy Homepage dashboard"
      kubernetes.core.helm:
        name: homepage
        chart_ref: jameswynn/homepage
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/homepage/values.yaml"
        wait: true
        timeout: "3m0s"
      tags: [phase3, homepage]

    - name: "Phase 3: Upload Plane base values"
      ansible.builtin.copy:
        src: ../helm/plane/values.yaml
        dest: "{{ helm_values_path }}/plane/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, plane]

    # Plane CE chart templates service URLs with FQDNs that fail during
    # pod startup DNS race conditions (musl libc + ndots:5 + headless svc).
    # Fix: inject our own app-env secret with short hostnames, then tell
    # the chart to use it via external_secrets.app_env_existingSecret.
    - name: "Phase 3: Create Plane app-env secret (short hostnames)"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: plane-app-env
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            DATABASE_URL: "postgresql://plane:{{ vault_pg_passwords.plane }}@postgresql-rw:5432/plane"
            REDIS_URL: "redis://:{{ vault_redis_password }}@valkey:6379/3"
            AMQP_URL: "amqp://plane:plane@plane-rabbitmq:5672/"
            SECRET_KEY: "{{ vault_plane_secret_key }}"
            LIVE_SERVER_SECRET_KEY: "{{ vault_plane_live_secret_key }}"
      no_log: true
      tags: [phase3, plane]

    - name: "Phase 3: Create Plane doc-store secret (Garage S3)"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: plane-doc-store-env
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            USE_MINIO: "0"
            AWS_ACCESS_KEY_ID: "{{ vault_garage_plane_access_key }}"
            AWS_SECRET_ACCESS_KEY: "{{ vault_garage_plane_secret_key }}"
            AWS_S3_ENDPOINT_URL: "http://garage:3900"
            AWS_S3_BUCKET_NAME: "plane-uploads"
            AWS_REGION: "garage"
            FILE_SIZE_LIMIT: "5242880"
      no_log: true
      tags: [phase3, plane]

    - name: "Phase 3: Write Plane secrets override"
      ansible.builtin.copy:
        content: |
          external_secrets:
            app_env_existingSecret: "plane-app-env"
            doc_store_existingSecret: "plane-doc-store-env"
        dest: "{{ helm_values_path }}/plane/secrets.yaml"
        owner: root
        mode: "0600"
      no_log: true
      tags: [phase3, plane]

    - name: "Phase 3: Deploy Plane CE"
      kubernetes.core.helm:
        name: plane
        chart_ref: makeplane/plane-ce
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/plane/values.yaml"
          - "{{ helm_values_path }}/plane/secrets.yaml"
        wait: true
        timeout: "10m0s"
      tags: [phase3, plane]

    # Plane CE creates headless services only. Create NodePort services
    # for Caddy path-based routing.
    - name: "Phase 3: Create Plane NodePort services for Caddy"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "plane-{{ item.name }}-np"
            namespace: "{{ k3s_namespace }}"
          spec:
            type: NodePort
            selector:
              app.name: "irl-plane-{{ item.name }}"
            ports:
              - name: http
                port: "{{ item.port }}"
                targetPort: "{{ item.port }}"
                nodePort: "{{ item.nodePort }}"
      loop:
        - { name: web,   port: 3000, nodePort: 30082 }
        - { name: api,   port: 8000, nodePort: 30083 }
        - { name: space, port: 3000, nodePort: 30084 }
        - { name: admin, port: 3000, nodePort: 30085 }
        - { name: live,  port: 3000, nodePort: 30086 }
      tags: [phase3, plane]

    # ── Phase 4: CI/CD ────────────────────────────────────────────
    # Jenkins SKIPPED: plugin version incompatibility (chart 2.479,
    # plugins need 2.479.1+). Revisit when CI/CD is needed.
    # May use Gitea Actions instead.
    #
    # - name: "Phase 4: Upload Jenkins values file"
    #   ansible.builtin.copy:
    #     src: ../helm/jenkins/values.yaml
    #     dest: "{{ helm_values_path }}/jenkins/values.yaml"
    #     owner: "{{ irl_admin_user }}"
    #     mode: "0640"
    #   tags: [phase4, jenkins]
    #
    # - name: "Phase 4: Deploy Jenkins"
    #   kubernetes.core.helm:
    #     name: jenkins
    #     chart_ref: jenkins/jenkins
    #     release_namespace: "{{ k3s_namespace }}"
    #     create_namespace: false
    #     values_files:
    #       - "{{ helm_values_path }}/jenkins/values.yaml"
    #     kubeconfig: "{{ kubeconfig }}"
    #     wait: true
    #     timeout: "5m0s"
    #   tags: [phase4, jenkins]

    # ── Phase 5: Agent Integration ────────────────────────────────

    - name: "Phase 5: Create Ollama models PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ollama-models-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: zfs-local
            resources:
              requests:
                storage: "200Gi"
            selector:
              matchLabels:
                app: ollama
      tags: [phase5, ollama]

    - name: "Phase 5: Upload Ollama values file"
      ansible.builtin.copy:
        src: ../helm/ollama/values.yaml
        dest: "{{ helm_values_path }}/ollama/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase5, ollama]

    - name: "Phase 5: Deploy Ollama"
      kubernetes.core.helm:
        name: ollama
        chart_ref: ollama-helm/ollama
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_path }}/ollama/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "30m0s"
      tags: [phase5, ollama]

    # ── Deploy summary ────────────────────────────────────────────

    - name: List deployed Helm releases
      ansible.builtin.command: >
        helm list --namespace {{ k3s_namespace }} --kubeconfig {{ kubeconfig }}
      register: helm_list
      changed_when: false
      tags: [always]

    - name: List CNPG operator
      ansible.builtin.command: >
        helm list --namespace cnpg-system --kubeconfig {{ kubeconfig }}
      register: cnpg_list
      changed_when: false
      tags: [always]

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Helm deployments:
          {{ cnpg_list.stdout }}
          {{ helm_list.stdout }}

          All services deployed via IRL charts or upstream values files.
          NodePorts defined in chart values, proxied by Caddy.
      tags: [always]
