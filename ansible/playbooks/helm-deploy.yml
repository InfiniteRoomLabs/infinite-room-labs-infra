---
# playbooks/helm-deploy.yml
# ==========================
# Deploys all IRL services to k3s using Helm charts.
#
# Charts are sourced from:
#   - IRL Helm repo (https://infiniteroomlabs.github.io/helm-charts/)
#   - Upstream repos (vault, authentik, jenkins, ollama)
#
# Prerequisites:
#   - k3s.yml complete (cluster running, namespace created, PVs created)
#   - k8s-secrets.yml complete (Kubernetes Secrets provisioned)
#
# Run full deploy:
#   ./run-ansible.sh playbook playbooks/helm-deploy.yml
#
# Run a single service:
#   ./run-ansible.sh playbook playbooks/helm-deploy.yml --tags postgres

- name: Helm chart deployment for all IRL services
  hosts: homelab
  become: true
  tags: [helm]

  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    k3s_namespace: irl
    helm_values_path: "/home/{{ irl_admin_user }}/helm-values"

  tasks:
    # ── Upload values override files to server ───────────────────
    - name: Create values override directories
      ansible.builtin.file:
        path: "{{ helm_values_path }}/{{ item }}"
        state: directory
        owner: "{{ irl_admin_user }}"
        group: "{{ irl_admin_user }}"
        mode: "0750"
      loop:
        - ""
        - vault
        - ollama
        - coredns
        - homepage
        - traefik
        - vaultwarden
        - nextcloud
        - monitoring
        - paperless
        - firefly
        - ghostfolio
        - firefly-importer
        - karakeep
        - satisfactory
        - palworld
      tags: [always]

    # ── Add Helm repositories ─────────────────────────────────────
    - name: Add Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
        force_update: true
      loop:
        - { name: irl, url: "https://infiniteroomlabs.github.io/helm-charts/" }
        - { name: hashicorp, url: "https://helm.releases.hashicorp.com" }
        - { name: cnpg, url: "https://cloudnative-pg.github.io/charts" }
        - { name: goauthentik, url: "https://charts.goauthentik.io" }

        - { name: jenkins, url: "https://charts.jenkins.io" }
        - { name: ollama-helm, url: "https://otwld.github.io/ollama-helm/" }
        - { name: guerzon, url: "https://guerzon.github.io/vaultwarden" }
        - { name: nextcloud, url: "https://nextcloud.github.io/helm/" }
        - { name: firefly-iii, url: "https://firefly-iii.github.io/kubernetes/" }
        - { name: ghostfolio, url: "https://bythehugo.github.io/ghostfolio-helm/" }
        - { name: karakeep-app, url: "https://karakeep-app.github.io/helm-charts" }
        - { name: traefik, url: "https://traefik.github.io/charts" }
      tags: [always]

    - name: Update Helm repo cache
      ansible.builtin.command: helm repo update
      changed_when: false
      tags: [always]

    # ══════════════════════════════════════════════════════════════
    # Phase 2: Core Data
    # ══════════════════════════════════════════════════════════════

    - name: "Phase 2: Install CNPG operator"
      kubernetes.core.helm:
        name: cnpg-operator
        chart_ref: cnpg/cloudnative-pg
        release_namespace: cnpg-system
        create_namespace: true
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, postgres]

    - name: "Phase 2: Deploy PostgreSQL (irl-postgres chart)"
      kubernetes.core.helm:
        name: postgresql
        chart_ref: irl/irl-postgres
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: false
        timeout: "5m0s"
        values:
          operator:
            enabled: false
          cluster:
            storage:
              storageClass: local-path
            nodePort: 30432
      tags: [phase2, postgres]

    - name: "Phase 2: Wait for CNPG cluster healthy"
      ansible.builtin.command: >
        kubectl get cluster postgresql -n {{ k3s_namespace }}
        -o jsonpath='{.status.phase}' --kubeconfig {{ kubeconfig }}
      register: cnpg_status
      until: "'Cluster in healthy state' in cnpg_status.stdout"
      retries: 60
      delay: 5
      changed_when: false
      tags: [phase2, postgres]

    - name: "Phase 2: Create service databases"
      kubernetes.core.k8s_exec:
        namespace: "{{ k3s_namespace }}"
        pod: "postgresql-1"
        container: postgres
        kubeconfig: "{{ kubeconfig }}"
        command: >
          psql -U postgres -c "
            DO $$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ item.name }}') THEN
                CREATE USER {{ item.name }} WITH PASSWORD '{{ vault_pg_passwords[item.name] }}';
              END IF;
            END $$;
            SELECT 'exists' FROM pg_database WHERE datname='{{ item.name }}';"
      loop: "{{ irl_pg_databases }}"
      no_log: true
      register: db_check
      tags: [phase2, postgres]

    - name: "Phase 2: Create databases (if not exist)"
      kubernetes.core.k8s_exec:
        namespace: "{{ k3s_namespace }}"
        pod: "postgresql-1"
        container: postgres
        kubeconfig: "{{ kubeconfig }}"
        command: >
          psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='{{ item.name }}'"
      loop: "{{ irl_pg_databases }}"
      register: db_exists
      changed_when: false
      tags: [phase2, postgres]

    - name: "Phase 2: Create missing databases"
      kubernetes.core.k8s_exec:
        namespace: "{{ k3s_namespace }}"
        pod: "postgresql-1"
        container: postgres
        kubeconfig: "{{ kubeconfig }}"
        command: >
          psql -U postgres -c "CREATE DATABASE {{ item.item.name }} OWNER {{ item.item.name }}"
      loop: "{{ db_exists.results }}"
      when: "'1' not in item.stdout"
      tags: [phase2, postgres]

    - name: "Phase 2: Deploy Valkey (irl-valkey chart)"
      kubernetes.core.helm:
        name: valkey
        chart_ref: irl/irl-valkey
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, valkey]

    # ── Garage S3 Object Storage ──────────────────────────────────

    # ── Internal DNS (CoreDNS for Tailscale Split DNS) ───────────
    # Serves lab.infiniteroomlabs.cloud and internal.infiniteroomlabs.cloud
    # zones. Records generated from irl_services dict.

    - name: "Phase 2: Add CoreDNS Helm repo"
      kubernetes.core.helm_repository:
        name: coredns
        repo_url: "https://coredns.github.io/helm"
      tags: [phase2, coredns]

    - name: "Phase 2: Template internal DNS zone file"
      ansible.builtin.template:
        src: ../templates/coredns-internal-zone.db.j2
        dest: "{{ helm_values_path }}/coredns-zone.db"
        owner: "{{ irl_admin_user }}"
        mode: "0644"
      vars:
        homelab_tailscale_ip: "100.86.213.22"
      tags: [phase2, coredns]

    - name: "Phase 2: Read zone file from server"
      ansible.builtin.slurp:
        src: "{{ helm_values_path }}/coredns-zone.db"
      register: zone_file_content
      tags: [phase2, coredns]

    - name: "Phase 2: Create CoreDNS zone ConfigMap"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: coredns-internal-zones
            namespace: "{{ k3s_namespace }}"
          data:
            lab.infiniteroomlabs.cloud.db: "{{ zone_file_content.content | b64decode }}"
      tags: [phase2, coredns]

    - name: "Phase 2: Upload CoreDNS values"
      ansible.builtin.copy:
        src: ../helm/coredns/values.yaml
        dest: "{{ helm_values_path }}/coredns/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase2, coredns]

    - name: "Phase 2: Deploy internal CoreDNS"
      kubernetes.core.helm:
        name: coredns-internal
        chart_ref: coredns/coredns
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/coredns/values.yaml"
        wait: true
        timeout: "3m0s"
      tags: [phase2, coredns]

    - name: "Phase 2: Create Garage data PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: garage-data-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "500Gi"
            selector:
              matchLabels:
                app: garage
      tags: [phase2, garage]

    - name: "Phase 2: Create Garage meta PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: garage-meta-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "5Gi"
            selector:
              matchLabels:
                app: garage
      tags: [phase2, garage]

    - name: "Phase 2: Create Garage secrets"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData: "{{ item.data }}"
      loop:
        - name: garage-rpc-secret
          data:
            rpc-secret: "{{ vault_garage_rpc_secret }}"
        - name: garage-admin-secret
          data:
            admin-token: "{{ vault_garage_admin_token }}"
            metrics-token: "{{ vault_garage_metrics_token }}"
      no_log: true
      tags: [phase2, garage]

    - name: "Phase 2: Deploy Garage (irl-garage chart)"
      kubernetes.core.helm:
        name: garage
        chart_ref: irl/irl-garage
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, garage]

    # ── OpenViking Context Database ────────────────────────────────

    - name: "Phase 2: Create OpenViking data PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: openviking-data-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "20Gi"
            selector:
              matchLabels:
                app: openviking
      tags: [phase2, openviking]

    - name: "Phase 2: Create OpenViking API key secret"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openviking-api-key
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            root-api-key: "{{ vault_openviking_api_key }}"
      no_log: true
      tags: [phase2, openviking]

    - name: "Phase 2: Create Gemini API key secret"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gemini-api-key
            namespace: "{{ k3s_namespace }}"
          type: Opaque
          stringData:
            api-key: "{{ vault_gemini_api_key }}"
      no_log: true
      tags: [phase2, openviking]

    - name: "Phase 2: Deploy OpenViking (irl-openviking chart)"
      kubernetes.core.helm:
        name: openviking
        chart_ref: irl/irl-openviking
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, openviking]

    - name: "Phase 2: Upload Vault values file"
      ansible.builtin.copy:
        src: ../helm/vault/values.yaml
        dest: "{{ helm_values_path }}/vault/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase2, vault]

    - name: "Phase 2: Deploy Vault"
      kubernetes.core.helm:
        name: vault
        chart_ref: hashicorp/vault
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_path }}/vault/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        timeout: "3m0s"
      tags: [phase2, vault]

    - name: "Phase 2: Display Vault init instructions"
      ansible.builtin.debug:
        msg: |
          Vault is running but NOT initialized.

          To initialize:
            kubectl exec -n irl vault-0 -- vault operator init -key-shares=5 -key-threshold=3

          To unseal (run 3x with different keys):
            kubectl exec -n irl vault-0 -- vault operator unseal

          See docs/runbooks/vault-sealed.md for the full procedure.
      tags: [phase2, vault]

    # ══════════════════════════════════════════════════════════════
    # Phase 2.5: Traefik Reverse Proxy (in-cluster, hostNetwork)
    # ══════════════════════════════════════════════════════════════

    - name: "Traefik: Upload values file"
      ansible.builtin.copy:
        src: ../helm/traefik/values.yaml
        dest: "{{ helm_values_path }}/traefik/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase2, traefik]

    - name: "Traefik: Deploy traefik chart"
      kubernetes.core.helm:
        name: traefik
        chart_ref: traefik/traefik
        chart_version: "39.0.7"  # last schema-compatible with our values; 40+ upgrade is a separate task
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/traefik/values.yaml"
        wait: true
        timeout: "5m0s"  # hostNetwork + Recreate strategy needs extra time
      tags: [phase2, traefik]

    - name: "Traefik: Wait for pod to be ready"
      ansible.builtin.command:
        cmd: >
          kubectl rollout status deployment/traefik
          -n {{ k3s_namespace }} --timeout=120s
          --kubeconfig {{ kubeconfig }}
      changed_when: false
      tags: [phase2, traefik]

    - name: "Traefik: Deploy HTTPS redirect middleware"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        template: ../templates/middleware-redirect-https.yaml.j2
      tags: [phase2, traefik]

    - name: "Traefik: Deploy standalone IngressRoutes"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        template: ../templates/ingressroute-standalone.yaml.j2
      vars:
        svc_name: "{{ item.key }}"
        svc_subdomain: "{{ item.value.subdomain }}"
        svc_domain: "{{ item.value.domain }}"
        svc_cluster_svc: "{{ item.value.cluster_svc }}"
        svc_cluster_port: "{{ item.value.cluster_port }}"
      loop: "{{ irl_traefik_standalone_services | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      tags: [phase2, traefik]

    # ══════════════════════════════════════════════════════════════
    # Phase 3: Dev Platform + Monitoring
    # ══════════════════════════════════════════════════════════════

    - name: "Phase 3: Write Gitea secrets override"
      ansible.builtin.copy:
        content: |
          gitea:
            gitea:
              config:
                database:
                  PASSWD: "{{ vault_pg_passwords.gitea }}"
                cache:
                  HOST: "redis://:{{ vault_redis_password }}@valkey:6379/0"
                session:
                  PROVIDER_CONFIG: "redis://:{{ vault_redis_password }}@valkey:6379/1"
                queue:
                  CONN_STR: "redis://:{{ vault_redis_password }}@valkey:6379/2"
        dest: "{{ helm_values_path }}/gitea-secrets.yaml"
        owner: root
        mode: "0600"
      no_log: true
      tags: [phase3, gitea]

    - name: "Phase 3: Upload Gitea values"
      ansible.builtin.copy:
        src: ../helm/gitea/values.yaml
        dest: "{{ helm_values_path }}/gitea/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, gitea]

    - name: "Phase 3: Deploy Gitea (irl-gitea chart)"
      kubernetes.core.helm:
        name: gitea
        chart_ref: irl/irl-gitea
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/gitea/values.yaml"
          - "{{ helm_values_path }}/gitea-secrets.yaml"
        wait: true
        timeout: "5m0s"
      tags: [phase3, gitea]

    - name: "Phase 3: Write Authentik secrets override"
      ansible.builtin.copy:
        content: |
          authentik:
            secret_key: "{{ vault_authentik_secret_key }}"
            postgresql:
              host: "postgresql-rw"
              name: "authentik"
              user: "authentik"
              password: "{{ vault_pg_passwords.authentik }}"
            redis:
              host: "valkey"
              password: "{{ vault_redis_password }}"
            bootstrap_password: "{{ vault_authentik_bootstrap_password }}"
          server:
            service:
              type: ClusterIP
            resources:
              limits:
                memory: "1536Mi"
              requests:
                memory: "512Mi"
          worker:
            resources:
              limits:
                memory: "768Mi"
              requests:
                memory: "128Mi"
          postgresql:
            enabled: false
          redis:
            enabled: false
        dest: "{{ helm_values_path }}/authentik-values.yaml"
        owner: root
        mode: "0600"
      no_log: true
      tags: [phase3, authentik]

    - name: "Phase 3: Deploy Authentik SSO"
      kubernetes.core.helm:
        name: authentik
        chart_ref: goauthentik/authentik
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/authentik-values.yaml"
        wait: true
        timeout: "5m0s"
      tags: [phase3, authentik]

    - name: "Phase 3: Upload monitoring values file"
      ansible.builtin.copy:
        src: ../helm/monitoring/values.yaml
        dest: "{{ helm_values_path }}/monitoring/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, monitoring]

    - name: "Phase 3: Deploy monitoring (irl-monitoring chart)"
      kubernetes.core.helm:
        name: monitoring
        chart_ref: irl/irl-monitoring
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/monitoring/values.yaml"
        values:
          kube-prometheus-stack:
            grafana:
              adminPassword: "{{ vault_grafana_admin_password }}"
        wait: true
        timeout: "10m0s"
      no_log: true
      tags: [phase3, monitoring]

    # ── Grafana dashboards ConfigMap ───────────────────────────────
    # The irl-monitoring chart mounts the `grafana-dashboards` ConfigMap
    # (dashboardsConfigMaps: irl-homelab) but does not create it. Recreate it
    # declaratively from the version-controlled JSON so a rebuild restores every
    # dashboard. `kubectl create --dry-run | apply` upserts all *.json in the dir.
    - name: "Phase 3: Sync grafana-dashboards ConfigMap from files/grafana/dashboards"
      ansible.builtin.shell:
        cmd: >-
          kubectl --kubeconfig {{ kubeconfig }}
          create configmap grafana-dashboards
          --from-file {{ playbook_dir }}/../files/grafana/dashboards
          --namespace {{ k3s_namespace }}
          --dry-run=client -o yaml
          | kubectl --kubeconfig {{ kubeconfig }} apply -f -
      register: grafana_dash_cm
      changed_when: "'unchanged' not in grafana_dash_cm.stdout"
      tags: [phase3, monitoring]

    # ── Homepage Dashboard ─────────────────────────────────────────

    - name: "Phase 3: Add Homepage Helm repo"
      kubernetes.core.helm_repository:
        name: jameswynn
        repo_url: "https://jameswynn.github.io/helm-charts"
      tags: [phase3, homepage]

    - name: "Phase 3: Upload Homepage values"
      ansible.builtin.copy:
        src: ../helm/homepage/values.yaml
        dest: "{{ helm_values_path }}/homepage/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, homepage]

    - name: "Phase 3: Deploy Homepage dashboard"
      kubernetes.core.helm:
        name: homepage
        chart_ref: jameswynn/homepage
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/homepage/values.yaml"
        wait: true
        timeout: "3m0s"
      tags: [phase3, homepage]

    # ── Vaultwarden (Password Manager) ──────────────────────────────

    - name: "Phase 3: Upload Vaultwarden values"
      ansible.builtin.copy:
        src: ../helm/vaultwarden/values.yaml
        dest: "{{ helm_values_path }}/vaultwarden/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, vaultwarden]

    - name: "Phase 3: Deploy Vaultwarden (irl-vaultwarden chart)"
      kubernetes.core.helm:
        name: vaultwarden
        chart_ref: irl/irl-vaultwarden
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/vaultwarden/values.yaml"
        wait: true
        timeout: "5m0s"
      tags: [phase3, vaultwarden]

    # ── Nextcloud (File Sharing) ──────────────────────────────────

    - name: "Phase 3: Write Nextcloud secrets override"
      ansible.builtin.copy:
        content: |
          nextcloud:
            password: "{{ vault_nextcloud_admin_password }}"
          externalDatabase:
            password: "{{ vault_pg_passwords.nextcloud }}"
          externalRedis:
            password: "{{ vault_redis_password }}"
        dest: "{{ helm_values_path }}/nextcloud-secrets.yaml"
        owner: root
        mode: "0600"
      no_log: true
      tags: [phase3, nextcloud]

    - name: "Phase 3: Upload Nextcloud values"
      ansible.builtin.copy:
        src: ../helm/nextcloud/values.yaml
        dest: "{{ helm_values_path }}/nextcloud/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, nextcloud]

    - name: "Phase 3: Deploy Nextcloud"
      kubernetes.core.helm:
        name: nextcloud
        chart_ref: nextcloud/nextcloud
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/nextcloud/values.yaml"
          - "{{ helm_values_path }}/nextcloud-secrets.yaml"
        wait: true
        timeout: "10m0s"
      tags: [phase3, nextcloud]

    # ── Paperless-ngx (document management) ──────────────────────
    # Prerequisites (in order):
    #   1. zfs.yml has created + chowned the paperless-media and
    #      paperless-data ZFS datasets
    #   2. credentials-rotation.yml has created the paperless-consume
    #      directory under nfs-share and added the sub-export with
    #      anonuid/anongid=1000
    #   3. k3s.yml has created the three hostPath PVs
    #   4. bw-sync has populated vault_pg_passwords.paperless,
    #      vault_paperless_secret_key, vault_paperless_admin_password
    #   5. k8s-secrets.yml has created the postgres-paperless and
    #      paperless-secrets K8s Secrets
    #   6. Phase 2 Postgres bootstrap has auto-provisioned the
    #      `paperless` DB + role from irl_pg_databases
    #   7. helm-charts submodule change (irl-paperless 0.1.0) is
    #      PUBLISHED to the chart-releaser GitHub Pages repo --
    #      deploy will fail with "chart not found" until push+publish

    - name: "Phase 3: Create Paperless consume PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: paperless-consume-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "50Gi"
            selector:
              matchLabels:
                app: paperless
      tags: [phase3, paperless]

    - name: "Phase 3: Create Paperless media PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: paperless-media-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "500Gi"
            selector:
              matchLabels:
                app: paperless
      tags: [phase3, paperless]

    - name: "Phase 3: Create Paperless data PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: paperless-data-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            resources:
              requests:
                storage: "20Gi"
            selector:
              matchLabels:
                app: paperless
      tags: [phase3, paperless]

    - name: "Phase 3: Create Paperless export PVC (ephemeral, backup CronJob)"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: paperless-export-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: local-path
            resources:
              requests:
                storage: "20Gi"
      tags: [phase3, paperless]

    - name: "Phase 3: Upload Paperless values"
      ansible.builtin.copy:
        src: ../helm/paperless/values.yaml
        dest: "{{ helm_values_path }}/paperless/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, paperless]

    # bjw-s/common alphabetizes env vars in the rendered Deployment, so
    # PAPERLESS_REDIS gets emitted before PAPERLESS_REDIS_PASSWORD and the
    # k8s $(VAR) substitution silently fails. Render the full URL with the
    # password embedded at deploy time, same pattern as gitea-secrets above.
    - name: "Phase 3: Write Paperless secrets override"
      ansible.builtin.copy:
        content: |
          paperless:
            env:
              PAPERLESS_REDIS: "redis://:{{ vault_redis_password }}@valkey:6379/3"
        dest: "{{ helm_values_path }}/paperless-secrets.yaml"
        owner: root
        mode: "0600"
      no_log: true
      tags: [phase3, paperless]

    - name: "Phase 3: Deploy Paperless-ngx (irl-paperless chart)"
      kubernetes.core.helm:
        name: paperless
        chart_ref: irl/irl-paperless
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/paperless/values.yaml"
          - "{{ helm_values_path }}/paperless-secrets.yaml"
        wait: true
        # Tika + Gotenberg image pulls are slow on first run
        timeout: "10m0s"
      tags: [phase3, paperless]

    # ── Firefly III (personal finance ledger) ─────────────────────
    # Requires: postgres-firefly + firefly-secrets K8s Secrets (k8s-secrets.yml),
    # the `firefly` DB/role (Phase 2 bootstrap from irl_pg_databases), and a
    # finances.lab IngressRoute (irl_traefik_standalone_services). The image
    # runs DB migrations automatically on first start.
    - name: "Phase 3: Upload Firefly III values"
      ansible.builtin.copy:
        src: ../helm/firefly/values.yaml
        dest: "{{ helm_values_path }}/firefly/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, firefly]

    - name: "Phase 3: Deploy Firefly III (firefly-iii chart)"
      kubernetes.core.helm:
        name: firefly
        chart_ref: firefly-iii/firefly-iii
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/firefly/values.yaml"
        wait: true
        timeout: "5m0s"
      tags: [phase3, firefly]

    # ── Ghostfolio (investment portfolio) ─────────────────────────
    # Bitnami postgresql+redis subcharts are disabled in values; reuses CNPG +
    # Valkey. Requires postgres-ghostfolio + ghostfolio-secrets + the `ghostfolio`
    # DB/role. Entrypoint runs `prisma migrate deploy` + seed on startup.
    - name: "Phase 3: Upload Ghostfolio values"
      ansible.builtin.copy:
        src: ../helm/ghostfolio/values.yaml
        dest: "{{ helm_values_path }}/ghostfolio/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, ghostfolio]

    - name: "Phase 3: Deploy Ghostfolio (ghostfolio chart)"
      kubernetes.core.helm:
        name: ghostfolio
        chart_ref: ghostfolio/ghostfolio
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/ghostfolio/values.yaml"
        wait: true
        timeout: "5m0s"
      tags: [phase3, ghostfolio]

    # ── Firefly III Data Importer (QFX/CSV ingest, stateless) ─────
    # Requires firefly-importer-secrets (accessToken = Firefly PAT) and the
    # firefly service. Routed at import.lab via IngressRoute.
    - name: "Phase 3: Upload Firefly Importer values"
      ansible.builtin.copy:
        src: ../helm/firefly-importer/values.yaml
        dest: "{{ helm_values_path }}/firefly-importer/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, firefly-importer]

    - name: "Phase 3: Deploy Firefly Importer (importer chart)"
      kubernetes.core.helm:
        name: firefly-importer
        chart_ref: firefly-iii/importer
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/firefly-importer/values.yaml"
        wait: true
        timeout: "5m0s"
      tags: [phase3, firefly-importer]

    # ── Karakeep (bookmarks: web + chrome + meilisearch) ──────────
    # Official upstream chart, PINNED (values overrides depend on chart
    # internals incl. its "meilesearch" secrets typo -- bump deliberately
    # with a render-diff review). Requires karakeep-secrets +
    # karakeep-meili-secrets (k8s-secrets.yml) and the pv-karakeep-* PVs
    # (k3s.yml). PVCs bind via explicit volumeName: both PVs share the
    # app=karakeep label, so a selector alone could bind the 20Gi claim
    # to the 50Gi PV. Routed at bookmarks.lab via IngressRoute.
    - name: "Phase 3: Create Karakeep data PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: karakeep-data
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            volumeName: pv-karakeep-data
            resources:
              requests:
                storage: "50Gi"
      tags: [phase3, karakeep]

    - name: "Phase 3: Create Karakeep meilisearch PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: karakeep-meilisearch
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            volumeName: pv-karakeep-meilisearch
            resources:
              requests:
                storage: "20Gi"
      tags: [phase3, karakeep]

    - name: "Phase 3: Upload Karakeep values"
      ansible.builtin.copy:
        src: ../helm/karakeep/values.yaml
        dest: "{{ helm_values_path }}/karakeep/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase3, karakeep]

    - name: "Phase 3: Deploy Karakeep (karakeep-app chart, pinned)"
      kubernetes.core.helm:
        name: karakeep
        chart_ref: karakeep-app/karakeep
        chart_version: "0.32.0"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/karakeep/values.yaml"
        wait: true
        timeout: "10m0s"
      tags: [phase3, karakeep]

    # ── Phase 4: CI/CD ────────────────────────────────────────────
    # Jenkins SKIPPED: plugin version incompatibility (chart 2.479,
    # plugins need 2.479.1+). Revisit when CI/CD is needed.
    # May use Gitea Actions instead.
    #
    # - name: "Phase 4: Upload Jenkins values file"
    #   ansible.builtin.copy:
    #     src: ../helm/jenkins/values.yaml
    #     dest: "{{ helm_values_path }}/jenkins/values.yaml"
    #     owner: "{{ irl_admin_user }}"
    #     mode: "0640"
    #   tags: [phase4, jenkins]
    #
    # - name: "Phase 4: Deploy Jenkins"
    #   kubernetes.core.helm:
    #     name: jenkins
    #     chart_ref: jenkins/jenkins
    #     release_namespace: "{{ k3s_namespace }}"
    #     create_namespace: false
    #     values_files:
    #       - "{{ helm_values_path }}/jenkins/values.yaml"
    #     kubeconfig: "{{ kubeconfig }}"
    #     wait: true
    #     timeout: "5m0s"
    #   tags: [phase4, jenkins]

    # ── Phase 5: Agent Integration ────────────────────────────────

    - name: "Phase 5: Create Ollama models PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ollama-models-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: zfs-local
            resources:
              requests:
                storage: "200Gi"
            selector:
              matchLabels:
                app: ollama
      tags: [phase5, ollama]

    - name: "Phase 5: Upload Ollama values file"
      ansible.builtin.copy:
        src: ../helm/ollama/values.yaml
        dest: "{{ helm_values_path }}/ollama/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase5, ollama]

    - name: "Phase 5: Deploy Ollama"
      kubernetes.core.helm:
        name: ollama
        chart_ref: ollama-helm/ollama
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_path }}/ollama/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "30m0s"
      tags: [phase5, ollama]

    # ── Satisfactory (dedicated game server) ──────────────────────
    # IRL chart (irl-satisfactory). Requires pv-satisfactory-config (k3s.yml),
    # the chowned satisfactory-config dataset (zfs.yml), and NodePorts
    # 30777 tcp+udp / 30888 tcp in the nftables allowlist (security playbook)
    # for LAN clients like the Steam Deck. No secrets -- the admin password
    # is set in-game at claim time and lives on the PVC.
    - name: "Phase 5: Create Satisfactory config PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: satisfactory-data-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            volumeName: pv-satisfactory-config
            resources:
              requests:
                storage: "40Gi"
      tags: [phase5, satisfactory]

    - name: "Phase 5: Upload Satisfactory values"
      ansible.builtin.copy:
        src: ../helm/satisfactory/values.yaml
        dest: "{{ helm_values_path }}/satisfactory/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase5, satisfactory]

    # wait: false on purpose -- first boot blocks on a ~10Gi SteamCMD pull
    # behind a 30-minute startupProbe. Watch it instead:
    #   kubectl -n irl logs -f deploy/satisfactory
    - name: "Phase 5: Deploy Satisfactory (irl-satisfactory chart)"
      kubernetes.core.helm:
        name: satisfactory
        chart_ref: irl/irl-satisfactory
        chart_version: "0.1.0"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/satisfactory/values.yaml"
        wait: false
      tags: [phase5, satisfactory]

    # ── Palworld (dedicated game server) ──────────────────────────
    # IRL chart (irl-palworld). Requires pv-palworld-data (k3s.yml), the
    # chowned palworld-data dataset (zfs.yml), NodePort 30211/udp in the
    # nftables allowlist (security playbook) for LAN clients, and the
    # palworld-secrets Secret (bw-sync: item palworld-admin-password ->
    # key ADMIN_PASSWORD) for RCON-driven graceful saves.
    - name: "Phase 5: Create Palworld data PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: palworld-data-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: zfs-local
            volumeName: pv-palworld-data
            resources:
              requests:
                storage: "30Gi"
      tags: [phase5, palworld]

    - name: "Phase 5: Upload Palworld values"
      ansible.builtin.copy:
        src: ../helm/palworld/values.yaml
        dest: "{{ helm_values_path }}/palworld/values.yaml"
        owner: "{{ irl_admin_user }}"
        mode: "0640"
      tags: [phase5, palworld]

    # wait: false on purpose -- first boot blocks on a multi-Gi SteamCMD pull
    # behind a 30-minute startupProbe. Watch it instead:
    #   kubectl -n irl logs -f deploy/palworld
    - name: "Phase 5: Deploy Palworld (irl-palworld chart)"
      kubernetes.core.helm:
        name: palworld
        chart_ref: irl/irl-palworld
        chart_version: "0.1.0"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        kubeconfig: "{{ kubeconfig }}"
        values_files:
          - "{{ helm_values_path }}/palworld/values.yaml"
        wait: false
      tags: [phase5, palworld]

    # ── Deploy summary ────────────────────────────────────────────

    - name: List deployed Helm releases
      ansible.builtin.command: >
        helm list --namespace {{ k3s_namespace }} --kubeconfig {{ kubeconfig }}
      register: helm_list
      changed_when: false
      tags: [always]

    - name: List CNPG operator
      ansible.builtin.command: >
        helm list --namespace cnpg-system --kubeconfig {{ kubeconfig }}
      register: cnpg_list
      changed_when: false
      tags: [always]

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Helm deployments:
          {{ cnpg_list.stdout }}
          {{ helm_list.stdout }}

          All services deployed via IRL Helm repo or upstream charts.
          Traefik (in-cluster, hostNetwork) routes all services via IngressRoute CRDs.
      tags: [always]
