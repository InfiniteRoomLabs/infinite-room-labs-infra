---
# playbooks/helm-deploy.yml
# ==========================
# Deploys all IRL services to k3s using Helm charts.
# Follows the same phase structure as the original Compose playbooks.
#
# Prerequisites:
#   - k3s.yml complete (cluster running, namespace created, PVs created)
#   - k8s-secrets.yml complete (Kubernetes Secrets provisioned)
#
# Run full deploy:
#   ./run-ansible.sh playbook playbooks/helm-deploy.yml
#
# Run a specific phase:
#   ./run-ansible.sh playbook playbooks/helm-deploy.yml --tags phase2
#
# Run a single service:
#   ./run-ansible.sh playbook playbooks/helm-deploy.yml --tags postgres

- name: Helm chart deployment for all IRL services
  hosts: homelab
  become: true
  tags: [phase2, phase3, phase4, phase5, helm]

  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    k3s_namespace: irl
    helm_values_base: "/home/{{ irl_admin_user }}/helm-values"

  tasks:
    # ── Upload values files to server ─────────────────────────────
    # Values files live in the repo at ansible/helm/. We copy them to
    # the server so kubernetes.core.helm can reference them by path.
    - name: Create Helm values directory on server
      ansible.builtin.file:
        path: "{{ helm_values_base }}/{{ item }}"
        state: directory
        owner: "{{ irl_admin_user }}"
        group: "{{ irl_admin_user }}"
        mode: "0750"
      loop:
        - postgres
        - redis
        - vault
        - gitea
        - authentik
        - plane
        - monitoring
        - loki
        - jenkins
        - ollama

    - name: Copy Helm values files to server
      ansible.builtin.copy:
        src: "../helm/{{ item }}/values.yaml"
        dest: "{{ helm_values_base }}/{{ item }}/values.yaml"
        owner: "{{ irl_admin_user }}"
        group: "{{ irl_admin_user }}"
        mode: "0640"
        backup: true
      loop:
        - postgres
        - redis
        - vault
        - gitea
        - authentik
        - plane
        - monitoring
        - loki
        - jenkins
        - ollama

    # ── Add Helm repos ─────────────────────────────────────────────
    - name: Add Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - name: bitnami
          url: https://charts.bitnami.com/bitnami
        - name: hashicorp
          url: https://helm.releases.hashicorp.com
        - name: gitea-charts
          url: https://dl.gitea.com/charts/
        - name: goauthentik
          url: https://charts.goauthentik.io
        - name: makeplane
          url: https://helm.plane.so/
        - name: prometheus-community
          url: https://prometheus-community.github.io/helm-charts
        - name: grafana
          url: https://grafana.github.io/helm-charts
        - name: jenkins
          url: https://charts.jenkins.io
        - name: ollama-helm
          url: https://otwld.github.io/ollama-helm/

    - name: Update Helm repo cache
      ansible.builtin.command: helm repo update
      changed_when: false

    # ── Phase 2: Core Data ─────────────────────────────────────────
    - name: "Phase 2: Deploy PostgreSQL 16"
      kubernetes.core.helm:
        name: postgresql
        chart_ref: bitnami/postgresql
        chart_version: "15.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/postgres/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "5m0s"
      tags: [phase2, postgres]

    - name: "Phase 2: Wait for PostgreSQL pod to be running"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ k3s_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=postgresql"
        kubeconfig: "{{ kubeconfig }}"
      register: pg_pods
      until:
        - pg_pods.resources | length > 0
        - pg_pods.resources[0].status.phase == "Running"
      retries: 30
      delay: 10
      tags: [phase2, postgres]

    - name: "Phase 2: Create per-service PostgreSQL users"
      kubernetes.core.k8s_exec:
        namespace: "{{ k3s_namespace }}"
        pod: "postgresql-0"
        kubeconfig: "{{ kubeconfig }}"
        command: >
          psql -U postgres -c
          "DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ item.name }}') THEN
              CREATE USER {{ item.name }} WITH PASSWORD '{{ vault_pg_passwords[item.name] }}';
              GRANT ALL PRIVILEGES ON DATABASE {{ item.name }} TO {{ item.name }};
            END IF;
          END $$;"
      loop: "{{ irl_pg_databases }}"
      no_log: true
      tags: [phase2, postgres]

    - name: "Phase 2: Deploy Redis"
      kubernetes.core.helm:
        name: redis
        chart_ref: bitnami/redis
        chart_version: "19.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/redis/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, redis]

    - name: "Phase 2: Deploy HashiCorp Vault"
      kubernetes.core.helm:
        name: vault
        chart_ref: hashicorp/vault
        chart_version: "0.28.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/vault/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "3m0s"
      tags: [phase2, vault]

    - name: "Phase 2: Display Vault init instructions"
      ansible.builtin.debug:
        msg: |
          Vault is running but NOT initialized. Init and unseal are manual operations.

          To initialize:
            kubectl exec -n irl vault-0 -- vault operator init -key-shares=5 -key-threshold=3

          Save the unseal keys and root token securely (see docs/runbooks/vault-sealed.md).

          To unseal (run 3x with different keys):
            kubectl exec -n irl vault-0 -- vault operator unseal
      tags: [phase2, vault]

    # ── Phase 3: Dev Platform ──────────────────────────────────────
    - name: "Phase 3: Create Gitea LFS PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: gitea-lfs-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            storageClassName: zfs-local
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi
            selector:
              matchLabels:
                app: gitea
      tags: [phase3, gitea]

    - name: "Phase 3: Deploy Gitea"
      kubernetes.core.helm:
        name: gitea
        chart_ref: gitea-charts/gitea
        chart_version: "10.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/gitea/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "5m0s"
      tags: [phase3, gitea]

    - name: "Phase 3: Deploy Authentik SSO"
      kubernetes.core.helm:
        name: authentik
        chart_ref: goauthentik/authentik
        chart_version: "2024.10.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/authentik/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "5m0s"
      tags: [phase3, authentik]

    - name: "Phase 3: Deploy Plane project management"
      kubernetes.core.helm:
        name: plane
        chart_ref: makeplane/plane-ce
        chart_version: "1.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/plane/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "5m0s"
      tags: [phase3, plane]

    - name: "Phase 3: Deploy kube-prometheus-stack (Prometheus + Grafana + Alertmanager)"
      kubernetes.core.helm:
        name: kube-prometheus-stack
        chart_ref: prometheus-community/kube-prometheus-stack
        chart_version: "65.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/monitoring/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "10m0s"
      tags: [phase3, monitoring]

    - name: "Phase 3: Create Grafana dashboards ConfigMap"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-dashboards
            namespace: "{{ k3s_namespace }}"
            labels:
              grafana_dashboard: "1"
      tags: [phase3, monitoring]

    - name: "Phase 3: Upload pre-built Grafana dashboards to ConfigMap"
      ansible.builtin.shell: >
        kubectl --kubeconfig {{ kubeconfig }} create configmap grafana-dashboards
        --from-file=../files/grafana/dashboards/
        --namespace {{ k3s_namespace }}
        --dry-run=client -o yaml | kubectl --kubeconfig {{ kubeconfig }} apply -f -
      changed_when: true
      tags: [phase3, monitoring]

    - name: "Phase 3: Create Loki data PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: loki-data-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            storageClassName: zfs-local
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
            selector:
              matchLabels:
                app: loki
      tags: [phase3, loki]

    - name: "Phase 3: Deploy Loki"
      kubernetes.core.helm:
        name: loki
        chart_ref: grafana/loki
        chart_version: "6.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/loki/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "5m0s"
      tags: [phase3, loki]

    # ── Phase 4: CI/CD ─────────────────────────────────────────────
    - name: "Phase 4: Deploy Jenkins"
      kubernetes.core.helm:
        name: jenkins
        chart_ref: jenkins/jenkins
        chart_version: "5.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/jenkins/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "5m0s"
      tags: [phase4, jenkins]

    - name: "Phase 4: Display Jenkins admin password retrieval command"
      ansible.builtin.debug:
        msg: |
          Jenkins deployed. To get the initial admin password:
            kubectl get secret irl-jenkins -n irl -o jsonpath='{.data.jenkins-admin-password}' | base64 -d

          Jenkins is accessible at https://ci.{{ irl_public_domain }}
          (after Caddy is configured to proxy NodePort 30080)
      tags: [phase4, jenkins]

    # ── Phase 5: Agent Integration ─────────────────────────────────
    - name: "Phase 5: Create Ollama models PVC"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: ollama-models-pvc
            namespace: "{{ k3s_namespace }}"
          spec:
            storageClassName: zfs-local
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 200Gi
            selector:
              matchLabels:
                app: ollama
      tags: [phase5, ollama]

    - name: "Phase 5: Deploy Ollama"
      kubernetes.core.helm:
        name: ollama
        chart_ref: ollama-helm/ollama
        chart_version: "0.x"
        release_namespace: "{{ k3s_namespace }}"
        create_namespace: false
        values_files:
          - "{{ helm_values_base }}/ollama/values.yaml"
        kubeconfig: "{{ kubeconfig }}"
        wait: true
        timeout: "30m0s"
      tags: [phase5, ollama]

    # ── Deploy summary ─────────────────────────────────────────────
    - name: List deployed Helm releases
      ansible.builtin.command: >
        helm list --namespace {{ k3s_namespace }} --kubeconfig {{ kubeconfig }}
      register: helm_list
      changed_when: false
      tags: [always]

    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Helm deployments in namespace {{ k3s_namespace }}:
          {{ helm_list.stdout }}

          NodePort -> Service mapping (for Caddy configuration):
            30432 -> PostgreSQL
            30200 -> HashiCorp Vault    (https://vault.{{ irl_public_domain }})
            30300 -> Gitea              (https://git.{{ irl_public_domain }})
            30022 -> Gitea SSH
            30900 -> Authentik          (https://auth.{{ irl_public_domain }})
            30082 -> Plane              (https://plane.{{ irl_public_domain }})
            30001 -> Grafana            (https://grafana.{{ irl_public_domain }})
            30090 -> Prometheus         (https://metrics.{{ irl_internal_domain }})
            30093 -> Alertmanager       (https://alerts.{{ irl_internal_domain }})
            30080 -> Jenkins            (https://ci.{{ irl_public_domain }})
            11434 -> Ollama             (ClusterIP only -- port-forward to access)
      tags: [always]
