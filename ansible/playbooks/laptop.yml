---
# playbooks/laptop.yml
# ====================
# Laptop-local automations for THIS machine (connection: local, no become).
# Deliberately NOT imported by site.yml -- the homelab orchestrator must never
# touch the personal laptop. Run it on its own.
#
# What: installs five laptop --user timers:
#   - threadwatch (5-hourly read-only `claude -p` knowledge-thread scanner),
#     cloned + pinned from the standalone threadwatch repo;
#   - claudesync (hourly claude.ai export + git commit) and claudesync-indexer
#     (daily `claude -p` reindex + commit), whose units live in the local
#     ~/claude-ai-export repo and are symlinked into place (no clone -- the timers
#     commit INTO that live repo);
#   - claudesync-embed (daily Cloudflare bge-m3 vector-embed into a local Chroma
#     .vector-db, after the indexer so it embeds fresh INDEX.md summaries; commits
#     nothing -- .vector-db is gitignored). Its units are shipped FROM this repo
#     (ansible/files/laptop/) and copied into place; it only operates on the
#     claude-ai-export data dir, with no symlink coupling to that repo's internals;
#   - knowledge-backup (6-hourly Tailscale-gated rsync of the knowledge archives
#     over SSH to the homelab main/backups ZFS dataset), shipped from ansible/files/laptop/.
# DR: docs/runbooks/laptop-agentic-dr.md covers rebuilding this from scratch.
# Secrets: none of its own. It still inherits the repo's vault-password
# mechanism via group_vars/all/vault.yml like every host, so fnox/BW_SESSION
# must be available when you run it.
#
# Run standalone (from ansible/):
#   uv run ansible-playbook playbooks/laptop.yml

- name: Laptop-local automations
  hosts: laptop
  become: false
  gather_facts: true
  tags: [laptop]
  vars:
    threadwatch_repo: "https://github.com/InfiniteRoomLabs/threadwatch.git"
    # Pin to an immutable commit, never a moving branch: the play runs the cloned
    # install.sh, so an unpinned ref is remote code execution of whatever HEAD becomes.
    # Bump this SHA deliberately after reviewing a new tag.
    threadwatch_version: "4a36c3ce8546e23f677ded746a5d9964bdc1157c"  # v0.1.5
    threadwatch_dir: "{{ ansible_user_dir }}/.local/share/threadwatch"
    # claudesync units live in the user's live claude-ai-export repo (not cloned):
    # the timer commits INTO that repo, so it must run against the canonical checkout.
    claudesync_dir: "{{ ansible_user_dir }}/claude-ai-export"
    # Grafana Alloy ships the timers' journals to the homelab. Pin explicitly
    # (jdx tools are installed globally as `latest`; project configs pin).
    alloy_version: "1.17.0"

  tasks:
    # -- threadwatch ----------------------------------------------------------
    - name: Clone/update the threadwatch tool repo
      ansible.builtin.git:
        repo: "{{ threadwatch_repo }}"
        dest: "{{ threadwatch_dir }}"
        version: "{{ threadwatch_version }}"
        update: true
        # The deploy clone is a pristine mirror of the pinned SHA. Discard any local
        # drift (edits belong in the source repo, not here) so it never blocks deploys.
        force: true

    - name: Install and enable the threadwatch user timer
      ansible.builtin.command:
        cmd: ./install.sh --enable
        chdir: "{{ threadwatch_dir }}"
      # systemctl --user needs the session bus; these facts exist post-gather.
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"
      register: tw_install
      changed_when: "'installed' in tw_install.stdout"

    # -- claudesync (units live in the local claude-ai-export repo) ------------
    - name: Check the claudesync units are present in claude-ai-export
      ansible.builtin.stat:
        path: "{{ claudesync_dir }}/systemd/claudesync.timer"
      register: cs_unit

    - name: Fail clearly if claude-ai-export units are missing
      ansible.builtin.fail:
        msg: "{{ claudesync_dir }}/systemd/claudesync.timer not found -- is the repo present and committed?"
      when: not cs_unit.stat.exists

    - name: Symlink the claudesync user units into place
      ansible.builtin.file:
        src: "{{ claudesync_dir }}/systemd/{{ item }}"
        dest: "{{ ansible_user_dir }}/.config/systemd/user/{{ item }}"
        state: link
        force: true
      loop:
        - claudesync.service
        - claudesync.timer
        - claudesync-indexer.service
        - claudesync-indexer.timer

    - name: Enable and start the claudesync timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - claudesync.timer
        - claudesync-indexer.timer
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"

    # -- claudesync-embed (Cloudflare bge-m3 vector index, daily) --------------
    # Units shipped FROM this repo (copied, not symlinked): the embed has no commit
    # step, so unlike claudesync there's no reason to live in the app repo. It runs
    # `uv run reindex embed` in ~/claude-ai-export via the unit's WorkingDirectory.
    - name: Install the claudesync-embed user units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/laptop/{{ item }}"
        dest: "{{ ansible_user_dir }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop:
        - claudesync-embed.service
        - claudesync-embed.timer

    - name: Enable and start the claudesync-embed timer
      ansible.builtin.systemd_service:
        name: claudesync-embed.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"

    # -- knowledge-backup (Tailscale-gated rsync to homelab NFS, every 6h) -----
    - name: Install the wait-for-it readiness helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/laptop/wait-for-it.sh"
        dest: "{{ ansible_user_dir }}/.local/bin/wait-for-it"
        mode: "0755"

    - name: Install the knowledge-backup wrapper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/laptop/knowledge-backup.sh"
        dest: "{{ ansible_user_dir }}/.local/bin/knowledge-backup"
        mode: "0755"

    - name: Install the knowledge-backup user units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/laptop/{{ item }}"
        dest: "{{ ansible_user_dir }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop:
        - knowledge-backup.service
        - knowledge-backup.timer

    - name: Enable and start the knowledge-backup timer
      ansible.builtin.systemd_service:
        name: knowledge-backup.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"

    # -- alloy (ship the timers' journals to homelab Loki via OTel) -----------
    # Long-running --user daemon (not a timer): reads the journals of the four
    # units above and forwards them to the homelab OTel Collector NodePort
    # (100.86.213.22:30418), which already exports logs to Loki. No homelab
    # change needed -- that NodePort exists for exactly this.
    - name: Install Grafana Alloy via mise (pinned)
      ansible.builtin.command:
        cmd: "mise use -g aqua:grafana/alloy@{{ alloy_version }}"
      register: alloy_install
      changed_when: "'alloy' in (alloy_install.stderr | default('')) and 'installing' in (alloy_install.stderr | default(''))"
      environment:
        PATH: "{{ ansible_user_dir }}/.local/bin:{{ ansible_env.PATH }}"

    - name: Ensure Alloy config + state directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ansible_user_dir }}/.config/alloy"
        - "{{ ansible_user_dir }}/.local/state/alloy"

    - name: Install the Alloy config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/laptop/alloy-config.alloy"
        dest: "{{ ansible_user_dir }}/.config/alloy/config.alloy"
        mode: "0644"
      register: alloy_config

    - name: Install the Alloy user unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/laptop/alloy.service"
        dest: "{{ ansible_user_dir }}/.config/systemd/user/alloy.service"
        mode: "0644"
      register: alloy_unit

    - name: Enable and start Alloy
      ansible.builtin.systemd_service:
        name: alloy.service
        scope: user
        enabled: true
        state: "{{ 'restarted' if (alloy_config.changed or alloy_unit.changed) else 'started' }}"
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"
