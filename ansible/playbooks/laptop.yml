---
# playbooks/laptop.yml
# ====================
# Laptop-local automations for THIS machine (connection: local, no become).
# Deliberately NOT imported by site.yml -- the homelab orchestrator must never
# touch the personal laptop. Run it on its own.
#
# What: installs three laptop --user timers:
#   - threadwatch (5-hourly read-only `claude -p` knowledge-thread scanner),
#     cloned + pinned from the standalone threadwatch repo;
#   - claudesync (hourly claude.ai export + git commit), whose units live in the
#     local ~/claude-ai-export repo and are symlinked into place (no clone -- the
#     timer commits INTO that live repo);
#   - knowledge-backup (6-hourly Tailscale-gated rsync of the knowledge archives
#     to the homelab NFS), shipped from ansible/files/laptop/.
# DR: docs/runbooks/laptop-agentic-dr.md covers rebuilding this from scratch.
# Secrets: none of its own. It still inherits the repo's vault-password
# mechanism via group_vars/all/vault.yml like every host, so fnox/BW_SESSION
# must be available when you run it.
#
# Run standalone (from ansible/):
#   uv run ansible-playbook playbooks/laptop.yml

- name: Laptop-local automations
  hosts: laptop
  become: false
  gather_facts: true
  tags: [laptop]
  vars:
    threadwatch_repo: "https://github.com/InfiniteRoomLabs/threadwatch.git"
    # Pin to an immutable commit, never a moving branch: the play runs the cloned
    # install.sh, so an unpinned ref is remote code execution of whatever HEAD becomes.
    # Bump this SHA deliberately after reviewing a new tag.
    threadwatch_version: "bc1b1fdd4f3bd8254b881f48217288c74b0954de"  # v0.1.3
    threadwatch_dir: "{{ ansible_user_dir }}/.local/share/threadwatch"
    # claudesync units live in the user's live claude-ai-export repo (not cloned):
    # the timer commits INTO that repo, so it must run against the canonical checkout.
    claudesync_dir: "{{ ansible_user_dir }}/claude-ai-export"

  tasks:
    # -- threadwatch ----------------------------------------------------------
    - name: Clone/update the threadwatch tool repo
      ansible.builtin.git:
        repo: "{{ threadwatch_repo }}"
        dest: "{{ threadwatch_dir }}"
        version: "{{ threadwatch_version }}"
        update: true

    - name: Install and enable the threadwatch user timer
      ansible.builtin.command:
        cmd: ./install.sh --enable
        chdir: "{{ threadwatch_dir }}"
      # systemctl --user needs the session bus; these facts exist post-gather.
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"
      register: tw_install
      changed_when: "'installed' in tw_install.stdout"

    # -- claudesync (units live in the local claude-ai-export repo) ------------
    - name: Check the claudesync units are present in claude-ai-export
      ansible.builtin.stat:
        path: "{{ claudesync_dir }}/systemd/claudesync.timer"
      register: cs_unit

    - name: Fail clearly if claude-ai-export units are missing
      ansible.builtin.fail:
        msg: "{{ claudesync_dir }}/systemd/claudesync.timer not found -- is the repo present and committed?"
      when: not cs_unit.stat.exists

    - name: Symlink the claudesync user units into place
      ansible.builtin.file:
        src: "{{ claudesync_dir }}/systemd/{{ item }}"
        dest: "{{ ansible_user_dir }}/.config/systemd/user/{{ item }}"
        state: link
        force: true
      loop:
        - claudesync.service
        - claudesync.timer

    - name: Enable and start the claudesync timer
      ansible.builtin.systemd_service:
        name: claudesync.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"

    # -- knowledge-backup (Tailscale-gated rsync to homelab NFS, every 6h) -----
    - name: Install the knowledge-backup wrapper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/laptop/knowledge-backup.sh"
        dest: "{{ ansible_user_dir }}/.local/bin/knowledge-backup"
        mode: "0755"

    - name: Install the knowledge-backup user units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/laptop/{{ item }}"
        dest: "{{ ansible_user_dir }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop:
        - knowledge-backup.service
        - knowledge-backup.timer

    - name: Enable and start the knowledge-backup timer
      ansible.builtin.systemd_service:
        name: knowledge-backup.timer
        scope: user
        enabled: true
        state: started
        daemon_reload: true
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_user_uid }}/bus"
