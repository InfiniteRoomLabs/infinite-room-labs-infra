# helm/ollama/values.yaml
# ========================
# Ollama Helm chart values for the IRL homelab.
# Chart: ollama-helm/ollama
# Repo: https://otwld.github.io/ollama-helm/
# Docs: https://github.com/otwld/ollama-helm
#
# Models stored on ZFS dataset: /media/root/storage1/ollama-models
# Access: ClusterIP only (agents access via kubectl port-forward)

ollama:
  # No GPU on HP Z600 -- CPU inference only
  gpu:
    enabled: false

  # Pull models on first startup (can be slow -- 30m timeout in helm-deploy.yml)
  models:
    pull:
      - llama3.2
      - codellama

# Resource limits -- CPU inference is RAM-hungry
resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "8Gi"
    cpu: "8000m"

# ZFS-backed model storage via pre-created PVC
# PV: pv-ollama-models (200Gi, hostPath to ZFS dataset)
# PVC: ollama-models-pvc (created in helm-deploy.yml)
persistentVolume:
  enabled: true
  existingClaim: ollama-models-pvc

service:
  type: ClusterIP
  port: 11434

ingress:
  enabled: false
