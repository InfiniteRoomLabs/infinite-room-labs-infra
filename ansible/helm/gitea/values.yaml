# helm/gitea/values.yaml
# =======================
# Environment overrides for the irl-gitea wrapper chart
# (helm-charts/charts/irl-gitea). Deployed by helm-deploy.yml --tags gitea,
# layered with the generated gitea-secrets.yaml (DB/Valkey credentials).
#
# NESTING: irl-gitea wraps the upstream gitea chart as a subchart named
# `gitea`, so every upstream key needs one extra `gitea:` level here:
#   upstream `image`         -> gitea.image
#   upstream `gitea.admin`   -> gitea.gitea.admin
#   upstream `gitea.config`  -> gitea.gitea.config
# Keys at the wrong level are silently ignored by Helm. Verify with
#   helm template gitea irl/irl-gitea --version <v> -f <this file>
#
# Chart defaults already carry the full homelab config (admin from the
# `gitea-admin` Secret, CNPG/Valkey, NodePorts, Traefik routes). Only put
# genuine per-environment deltas here.

gitea: {}
