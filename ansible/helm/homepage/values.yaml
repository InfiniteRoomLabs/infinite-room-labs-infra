# helm/homepage/values.yaml
# =========================
# Homepage dashboard (gethomepage.dev)
# Chart: jameswynn/homepage
#
# Central landing page for all IRL homelab services.
# Accessible at home.lab.infiniteroomlabs.cloud via Caddy.

image:
  repository: ghcr.io/gethomepage/homepage
  tag: v1.2.0

enableRbac: true

serviceAccount:
  create: true
  name: homepage

service:
  main:
    type: ClusterIP
    ports:
      http:
        port: 3000

# Schedule on homelab node
nodeSelector:
  irl.dev/tier: data

env:
  HOMEPAGE_ALLOWED_HOSTS: "home.lab.infiniteroomlabs.cloud"
  HOMEPAGE_VAR_GRAFANA_USER:
    valueFrom:
      secretKeyRef:
        name: grafana-admin
        key: admin-user
  HOMEPAGE_VAR_GRAFANA_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: grafana-admin
        key: admin-password
  HOMEPAGE_VAR_GITEA_KEY:
    valueFrom:
      secretKeyRef:
        name: homepage-api-keys
        key: gitea-token
        optional: true
  HOMEPAGE_VAR_AUTHENTIK_KEY:
    valueFrom:
      secretKeyRef:
        name: homepage-api-keys
        key: authentik-token
        optional: true

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

config:
  settings:
    title: Infinite Room Labs
    favicon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/home-assistant.svg
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Infrastructure:
        style: row
        columns: 3
      Dev Platform:
        style: row
        columns: 3
      Productivity:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
      AI / ML:
        style: row
        columns: 2

  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "IRL Homelab"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  services:
    - Infrastructure:
        - PostgreSQL:
            icon: postgres
            href: ""
            description: "CNPG operator -- 5 databases"
            namespace: irl
            app: postgresql
        - Valkey:
            icon: redis
            href: ""
            description: "Redis-compatible cache + queue"
            namespace: irl
            app: valkey
        - Vault:
            icon: vault
            href: "https://vault.lab.infiniteroomlabs.cloud"
            description: "Secrets management"
            namespace: irl
            app: vault
        - Garage S3:
            icon: minio
            href: "https://storage.internal.lab.infiniteroomlabs.cloud"
            description: "S3-compatible object storage (ZFS-backed)"
            namespace: irl
            app: garage
        - CoreDNS:
            icon: coredns
            href: ""
            description: "Internal Split DNS"
            namespace: irl
            app: coredns

    - Dev Platform:
        - Gitea:
            icon: gitea
            href: "https://git.lab.infiniteroomlabs.cloud"
            description: "Git server + CI"
            namespace: irl
            app: gitea
            widget:
              type: gitea
              url: "http://gitea-http:3000"
              key: "{{HOMEPAGE_VAR_GITEA_KEY}}"
        - Authentik:
            icon: authentik
            href: "https://auth.lab.infiniteroomlabs.cloud"
            description: "SSO / Identity provider"
            namespace: irl
            app: authentik
            widget:
              type: authentik
              url: "http://authentik-server"
              key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"
        - Plane:
            icon: plane
            href: "https://app.plane.so/infinite-room-labs/"
            description: "Project management (SaaS)"

    - Productivity:
        - Paperless-ngx:
            icon: paperless-ngx
            href: "https://archives.lab.infiniteroomlabs.cloud"
            description: "Document management + OCR (scanbridge inbox)"
            namespace: irl
            app: paperless
            # TODO: wire paperless-ngx widget once deployed and a paperless
            # API token is generated in the UI. Widget needs:
            #   widget:
            #     type: paperlessngx
            #     url: "http://paperless:8000"
            #     username: "admin"    # or a service account
            #     password: "{{HOMEPAGE_VAR_PAPERLESS_KEY}}"   # or key: ... for token
            # Token goes in the homepage-api-keys secret as paperless-token.

    - Monitoring:
        - Grafana:
            icon: grafana
            href: "https://grafana.lab.infiniteroomlabs.cloud"
            description: "Dashboards + visualization"
            namespace: irl
            app: grafana
            widget:
              type: grafana
              url: "http://monitoring-grafana"
              username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        - Prometheus:
            icon: prometheus
            href: "https://metrics.internal.lab.infiniteroomlabs.cloud"
            description: "Metrics collection"
            namespace: irl
            app: prometheus
            widget:
              type: prometheus
              url: "http://monitoring-kube-prometheus-prometheus:9090"
        - Alertmanager:
            icon: alertmanager
            href: "https://alerts.internal.lab.infiniteroomlabs.cloud"
            description: "Alert routing"
            namespace: irl
            app: alertmanager

    - AI / ML:
        - Ollama:
            icon: ollama
            href: ""
            description: "LLM inference (llama3.2, codellama, nomic-embed-text)"
            namespace: irl
            app: ollama
        - OpenViking:
            icon: meilisearch
            href: "https://context.internal.lab.infiniteroomlabs.cloud"
            description: "Agent memory / RAG context database"
            namespace: irl
            app: openviking

  bookmarks: []

  kubernetes:
    mode: cluster
