# helm/paperless/values.yaml
# ============================
# Environment-specific overrides for the irl-paperless chart on the homelab.
#
# The chart's built-in defaults (helm-charts/charts/irl-paperless/values.yaml)
# already target this cluster specifically -- this file exists to:
#   1. Surface the load-bearing knobs (ports, host, enabled features) in one
#      place for operators to scan.
#   2. Let this environment override the chart without forcing a chart version
#      bump for homelab-only tweaks.
#
# Secrets are NOT in this file. They flow via the paperless-secrets task in
# helm-deploy.yml which writes paperless-secrets.yaml alongside this file.
#
# Chart: irl/irl-paperless >= 0.1.0 (wraps gabe565/paperless-ngx 0.24.1)

# ── Upstream chart (aliased as `paperless` in Chart.yaml dependency) ──
paperless:
  service:
    main:
      type: NodePort
      ports:
        http:
          port: 8000
          # Verify free before deploy:
          # kubectl get svc -A -o jsonpath='{range .items[*]}{.spec.ports[*].nodePort}{"\n"}{end}' | sort -u
          nodePort: 30800

  resources:
    requests:
      # Modest reservation -- single-node homelab, the scheduler isn't bin-packing.
      # The LIMIT (not the request) is what gates OCR throughput here.
      memory: "1Gi"
      cpu: "1000m"
    limits:
      # Sized for 8 task workers x 2 threads (~16 parallel OCR threads).
      # CPU: the OLD 2000m limit hard-throttled the whole pod via CFS -- bumping
      # PAPERLESS_TASK_WORKERS without raising this does NOTHING (more workers just
      # contend for the same 2 cores). 16 cores leaves 8 of the node's 24 for the
      # system + idle neighbors.
      # Memory: each worker can spike ~1G on large scanned PDFs (Ghostscript page
      # rasters); 20Gi covers the 8x2 worst case within the node's ~22G free headroom.
      memory: "20Gi"
      cpu: "16000m"

  # ── Celery worker sizing (overrides chart default 2/2/2/1800) ──
  # `env` is a map in bjw-s/common, so Helm deep-merges these onto the chart's
  # env block -- only these keys change.
  #
  # TWO independent parallelism knobs (do not confuse them):
  #   TASK_WORKERS       = how many DOCUMENTS OCR at once (Celery concurrency).
  #   THREADS_PER_WORKER = how many PAGES OCR at once WITHIN one doc
  #                        (OCRmyPDF --jobs; Tesseract is ~1 thread/page).
  # Invariant: TASK_WORKERS x THREADS_PER_WORKER <= host vCPU (Z600 = 24).
  #
  # The product is "peak OCR threads"; how you SPLIT it is a throughput-vs-latency
  # choice. A single huge scan only ever uses THREADS_PER_WORKER threads -- so a
  # WORKERS-heavy split (e.g. 8x2) leaves one 300-page scan crawling on 2 threads
  # while 7 workers idle. That is what bit the 2026-06 bulk archival
  # intake (a 295-page scan nearly hit the 3600s timeout at 2 threads).
  #
  # Profiles (pick per expected workload; keep product <= 24):
  #   batch     8 x 2  -> max doc-throughput; WORST for a lone monster doc
  #   balanced  4 x 5  -> default; clears batches AND OCRs a big scan ~2.5x faster
  #   big-scan  2 x 10 -> for bulk huge multi-hundred-page scans; few docs at once
  #
  # Memory: each worker can spike ~1.5G on large scanned PDFs (Ghostscript page
  # rasterization). 4 workers x ~1.5G = ~6G, well under the pod limit.
  env:
    PAPERLESS_TASK_WORKERS: "4"        # balanced profile: 4 documents in parallel
    PAPERLESS_THREADS_PER_WORKER: "5"  # 5 pages/doc in parallel; 4 x 5 = 20 cores peak
    PAPERLESS_WEBSERVER_WORKERS: "3"   # gunicorn workers for the UI/API
    PAPERLESS_WORKER_TIMEOUT: "7200"   # 2h hard limit; a 300-page 680dpi scan can
                                       # exceed 3600s even parallelized. Tune down
                                       # only if you never ingest monster scans.

# ── Traefik IngressRoute (rendered by chart's own template) ──
ingress:
  enabled: true
  host: "archives.lab.infiniteroomlabs.cloud"

# ── Apache Tika (Office doc parsing) ──
# Chart default ghcr.io/paperless-ngx/tika:latest returns 403 -- that image
# isn't published at that path. Upstream paperless docker-compose uses the
# native Apache Tika image. Override here until the chart default is fixed.
tika:
  enabled: true
  image:
    repository: docker.io/apache/tika
    tag: "latest"

# ── Gotenberg (headless Chromium for HTML/PDF conversion) ──
gotenberg:
  enabled: true

# ── Nightly document_exporter backup to Garage S3 ──
backup:
  enabled: true
  schedule: "0 3 * * *"
  timeZone: "America/New_York"
  s3:
    endpoint: "https://s3.internal.lab.infiniteroomlabs.cloud"
    bucket: "paperless-backups"
  retentionDays: 30
