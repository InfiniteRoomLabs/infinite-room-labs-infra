# helm/plane/values.yaml
# =======================
# Plane CE (community edition) for the IRL homelab.
# Chart: makeplane/plane-ce v1.4.1
# Repo: https://helm.plane.so/
# Docs: https://docs.plane.so/self-hosting/methods/kubernetes
#
# Uses external PostgreSQL (CNPG) and Redis (Valkey).
# Local MinIO for file storage. Local RabbitMQ for async.
# Ingress disabled -- Caddy on bare metal handles TLS + routing.

planeVersion: v1.2.0

# ── Disable bundled databases -- using dedicated charts ──────────
postgres:
  local_setup: false

redis:
  local_setup: false

rabbitmq:
  local_setup: true
  storageClass: local-path
  volumeSize: 500Mi

minio:
  local_setup: true
  storageClass: local-path
  volumeSize: 5Gi

# ── Ingress disabled -- Caddy handles TLS ────────────────────────
ingress:
  enabled: false

# ── Resource limits (homelab-sized) ──────────────────────────────
web:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 128Mi

space:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 64Mi

admin:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 64Mi

live:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 64Mi

api:
  replicas: 1
  memoryLimit: 1Gi
  cpuLimit: 1000m
  cpuRequest: 100m
  memoryRequest: 256Mi

worker:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 128Mi

beatworker:
  replicas: 1
  memoryLimit: 256Mi
  cpuLimit: 250m
  cpuRequest: 50m
  memoryRequest: 64Mi

# ── Environment -- secrets injected via Ansible override file ────
# env.pgdb_remote_url, env.remote_redis_url, env.secret_key,
# and minio credentials are written to a secrets override file
# by helm-deploy.yml and merged at deploy time.
env:
  pgdb_username: plane
  pgdb_name: plane
  docstore_bucket: "uploads"
  doc_upload_size_limit: "5242880"
  default_cluster_domain: cluster.local
