# helm/plane/values.yaml
# =======================
# Plane CE (community edition) for the IRL homelab.
# Chart: makeplane/plane-ce v1.4.1
# Repo: https://helm.plane.so/
# Docs: https://docs.plane.so/self-hosting/methods/kubernetes
#
# Uses external PostgreSQL (CNPG) and Redis (Valkey).
# Local MinIO for file storage. Local RabbitMQ for async.
# All Plane pods scheduled on homelab node (data tier).

planeVersion: v1.2.3

# ── Disable bundled databases -- using dedicated charts ──────────
postgres:
  local_setup: false

redis:
  local_setup: false

rabbitmq:
  local_setup: true
  storageClass: local-path
  volumeSize: 500Mi
  nodeSelector:
    irl.dev/tier: data

# MinIO disabled -- using Garage S3-compatible storage on homelab
minio:
  local_setup: false

# ── Ingress disabled -- Caddy handles TLS ────────────────────────
ingress:
  enabled: false
  appHost: "plane.lab.infiniteroomlabs.cloud"

# ── Scheduling: all pods on homelab data tier ────────────────────
web:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 128Mi
  nodeSelector:
    irl.dev/tier: data

space:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 64Mi
  nodeSelector:
    irl.dev/tier: data

admin:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 64Mi
  nodeSelector:
    irl.dev/tier: data

live:
  replicas: 1
  memoryLimit: 512Mi
  cpuLimit: 500m
  cpuRequest: 50m
  memoryRequest: 64Mi
  nodeSelector:
    irl.dev/tier: data

api:
  replicas: 1
  memoryLimit: 1Gi
  cpuLimit: 1000m
  cpuRequest: 100m
  memoryRequest: 256Mi
  nodeSelector:
    irl.dev/tier: data

worker:
  replicas: 1
  memoryLimit: 2Gi
  cpuLimit: 1000m
  cpuRequest: 100m
  memoryRequest: 512Mi
  nodeSelector:
    irl.dev/tier: data

beatworker:
  replicas: 1
  memoryLimit: 256Mi
  cpuLimit: 250m
  cpuRequest: 50m
  memoryRequest: 64Mi
  nodeSelector:
    irl.dev/tier: data

# ── Environment -- secrets injected via Ansible override file ────
env:
  pgdb_username: plane
  pgdb_name: plane
  docstore_bucket: "uploads"
  doc_upload_size_limit: "5242880"
  default_cluster_domain: cluster.local
  cors_allowed_origins: "https://plane.lab.infiniteroomlabs.cloud"
  app_base_url: "https://plane.lab.infiniteroomlabs.cloud"
  admin_base_url: "https://plane.lab.infiniteroomlabs.cloud/god-mode/"
  space_base_url: "https://plane.lab.infiniteroomlabs.cloud/spaces/"
  live_base_url: "https://plane.lab.infiniteroomlabs.cloud/live/"
