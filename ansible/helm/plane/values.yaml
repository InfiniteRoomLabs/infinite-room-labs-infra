# helm/plane/values.yaml
# =======================
# Plane project management chart values for the IRL homelab.
# Chart: makeplane/plane-ce (community edition)
# Repo: https://helm.plane.so/
# Docs: https://docs.plane.so/self-hosting/methods/kubernetes
#
# Memory limits from irl_mem_limits:
#   plane_api: 1g
#   plane_worker: 512m
#   plane_web: 512m
#   plane_minio: 512m
# Domain: plane.lab.infiniteroomlabs.cloud
# NodePort 30082 -> Caddy proxies at https://plane.lab.infiniteroomlabs.cloud

planeVersion: "0.23"

# Web frontend
web:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1000m"

# API backend
api:
  replicas: 1
  secret_key:
    valueFrom:
      secretKeyRef:
        name: plane-secrets
        key: secret-key
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Async worker
worker:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Beat scheduler
beatworker:
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

# Database configuration -- external PostgreSQL
db:
  host: "postgresql.irl.svc.cluster.local"
  port: 5432
  name: plane
  user: plane
  password:
    valueFrom:
      secretKeyRef:
        name: postgres-plane
        key: password
  postgresqlMaxConnections: 20

# Redis -- external Redis
redis:
  host: "redis-master.irl.svc.cluster.local"
  port: 6379
  password:
    valueFrom:
      secretKeyRef:
        name: redis-auth
        key: redis-password

# MinIO for file storage
minio:
  enabled: true
  storageSize: "50Gi"
  storageClass: local-path
  root_user: plane
  root_password:
    valueFrom:
      secretKeyRef:
        name: plane-secrets
        key: minio-root-password
  # Resource limits mapped from irl_mem_limits.plane_minio: 512m
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Ingress via NodePort -- Caddy handles TLS termination
ingress:
  enabled: false

service:
  type: NodePort
  nodePort: 30082

# Disable bundled dependencies -- using dedicated charts
postgresql:
  enabled: false

rabbitmq:
  enabled: false
