# helm/vault/values.yaml
# =======================
# HashiCorp Vault chart values for the IRL homelab.
# Chart: hashicorp/vault
# Docs: https://developer.hashicorp.com/vault/docs/platform/k8s/helm
#
# Memory limit from irl_mem_limits.vault: 256m
#
# NOTE: Vault init and unseal are MANUAL operations (by design).
# Unseal keys must never be automated without a KMS.
# See docs/runbooks/vault-sealed.md for the unseal procedure.

server:
  image:
    repository: hashicorp/vault
    tag: "1.17"

  # Resource limits mapped from irl_mem_limits.vault: 256m
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  # Vault config: file storage backend (ZFS-backed PV), TCP listener.
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

  service:
    type: ClusterIP
    port: 8200

  dataStorage:
    enabled: true
    storageClass: local-path
    size: 5Gi

  # Readiness: Vault returns 200 when initialized and unsealed,
  # 429 when standby, 472/501/503 when sealed/uninit.
  # Allow 429 (standby is healthy for single-node) and 200.
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"

# Disable HA -- single-node homelab.
ha:
  enabled: false

# Disable injector -- we read secrets via Vault API, not sidecar injection.
injector:
  enabled: false

# Disable CSI provider.
csi:
  enabled: false

ui:
  enabled: true
  serviceType: ClusterIP
