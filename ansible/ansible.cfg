[defaults]
# Ansible configuration for Infinite Room Labs homelab automation
# See: https://docs.ansible.com/ansible/latest/reference_appendices/config.html

# Output formatting
stdout_callback = ansible.builtin.default
result_format = yaml
bin_ansible_callbacks = True

# Inventory
inventory = inventory/hosts.ini

# Vault password via fnox (executable password file). Ansible runs this script
# and reads the password from stdout -- it fetches ANSIBLE_VAULT_PASSWORD from
# fnox (Bitwarden-backed). Resolved relative to cwd; run ansible from ansible/.
# The legacy Docker runner overrides this with a host-resolved file (see
# run-ansible.sh) since fnox is not present inside the container.
vault_password_file = ../scripts/vault-pass.sh

# SSH connection tuning
forks = 10
timeout = 30

# Fact caching -- JSON files, 1 hour TTL
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

# Retry files clutter the working directory
retry_files_enabled = False

# Do not check host keys -- we manage trust via SSH keys and Tailscale
host_key_checking = False

# Require fully-qualified collection names (FQCN) for all modules
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections

[ssh_connection]
# SSH pipelining reduces round-trips (requires requiretty disabled on target)
pipelining = True

# ControlMaster for connection reuse
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null

[privilege_escalation]
# Default privilege escalation to root via sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False
