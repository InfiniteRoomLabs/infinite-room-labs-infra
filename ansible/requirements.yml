---
# Galaxy requirements for Infinite Room Labs homelab automation
# Install with: ./run-ansible.sh galaxy install

collections:
  - name: community.general
    version: ">=9.0.0"
  - name: community.docker
    version: ">=3.0.0"
  - name: community.postgresql
    version: ">=3.0.0"
  - name: ansible.posix
    version: ">=1.5.0"
  # Required for k3s + Helm management (k8s, helm, k8s_info, k8s_exec modules)
  - name: kubernetes.core
    version: ">=3.0.0"

roles:
  - name: geerlingguy.docker
    version: "7.4.1"
