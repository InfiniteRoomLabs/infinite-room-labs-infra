---
# Homelab group-specific variables
# =================================
# Applied to all hosts in the [homelab] group.

# Firewall (nftables)
irl_firewall_allowed_tcp_ports:
  - 22     # SSH
  - 80     # HTTP (Traefik)
  - 443    # HTTPS (Traefik)
  - 2222   # Gitea SSH (Traefik TCP)
  - 6443   # k3s API server
  - 41641  # Tailscale direct connections

# NFS -- allowed networks (LAN + Tailscale)
irl_nfs_allowed_subnets:
  - { cidr: "192.168.2.0/24", mode: "ro" }    # LAN (read-only)
  - { cidr: "100.64.0.0/10", mode: "rw" }     # Tailscale (read-write)
