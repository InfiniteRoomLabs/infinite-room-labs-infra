---
# Global variables shared by all playbooks
# ==========================================
# These define the "contract" that every playbook reads from.
# Host-specific overrides go in host_vars/homelab.yml.

# ── Company ──────────────────────────────────────────────────────────
irl_company_name: "Infinite Room Labs"

# ── k3s / Kubernetes ─────────────────────────────────────────────────
# Single-node k3s. Traefik deployed via Helm (hostNetwork, LE DNS-01).
# Services use ClusterIP; Traefik routes via IngressRoute CRDs.
irl_k3s_namespace: "irl"
irl_k3s_kubeconfig: "/etc/rancher/k3s/k3s.yaml"
irl_helm_values_base: "/home/{{ irl_admin_user }}/helm-values"

# ── Compose base path (DEPRECATED -- kept for cleanup playbook reference) ──
# Docker Compose stacks have been replaced by k3s + Helm charts.
# This path is referenced only by cleanup.yml to remove old stacks.
irl_compose_base: "/opt/irl"

# ── ZFS ──────────────────────────────────────────────────────────────
irl_zfs_pool: "main"
irl_zfs_mount: "/media/root/storage1"
irl_zfs_datasets:
  - name: "{{ irl_zfs_pool }}/backups"
    mountpoint: "{{ irl_zfs_mount }}/backups"
    quota: "500G"
  - name: "{{ irl_zfs_pool }}/artifacts"
    mountpoint: "{{ irl_zfs_mount }}/artifacts"
    quota: "200G"
  - name: "{{ irl_zfs_pool }}/logs"
    mountpoint: "{{ irl_zfs_mount }}/logs"
    quota: "100G"
  - name: "{{ irl_zfs_pool }}/ollama-models"
    mountpoint: "{{ irl_zfs_mount }}/ollama-models"
    quota: "200G"
  - name: "{{ irl_zfs_pool }}/gitea-lfs"
    mountpoint: "{{ irl_zfs_mount }}/gitea-lfs"
    quota: "100G"
  - name: "{{ irl_zfs_pool }}/garage-data"
    mountpoint: "{{ irl_zfs_mount }}/garage-data"
    quota: "500G"
    properties:
      recordsize: "1M"
      atime: "off"
      compression: "lz4"
      xattr: "sa"
  # ── Paperless-ngx (document management) ─────────────────────
  # Media and data get dedicated datasets (consistent with gitea-lfs and
  # ollama-models). The consume dir is NOT a dataset -- it lives as a
  # subdirectory under the existing hand-managed nfs-share so the laptop
  # can reach it via the already-mounted /mnt/homelab-nfs without adding
  # new exports. All paths are chowned to 1000:1000 in zfs.yml.
  - name: "{{ irl_zfs_pool }}/paperless-media"
    mountpoint: "{{ irl_zfs_mount }}/paperless-media"
    quota: "500G"
    properties:
      atime: "off"
      compression: "lz4"
  - name: "{{ irl_zfs_pool }}/paperless-data"
    mountpoint: "{{ irl_zfs_mount }}/paperless-data"
    quota: "20G"
    properties:
      atime: "off"
      compression: "lz4"
  # ── VM hosting (KVM/libvirt) ─────────────────────────────────
  # images/ holds versioned Packer gold masters (published from the laptop
  # via packer/scripts/publish-image.sh); disks/ holds per-VM qcow2 files
  # backed by a gold master. 64K recordsize matches the qcow2 cluster size.
  - name: "{{ irl_zfs_pool }}/vms"
    mountpoint: "{{ irl_zfs_mount }}/vms"
    quota: "300G"
    properties:
      recordsize: "64K"
      atime: "off"
      compression: "lz4"
  # ── Karakeep (bookmarks) ─────────────────────────────────────
  # Data holds the SQLite DB + archived pages/screenshots (authoritative,
  # must be backed up). Meilisearch is the rebuildable search index; it
  # runs as UID 1000 and is chowned in zfs.yml (karakeep-data stays
  # root-owned -- the karakeep container runs as root).
  - name: "{{ irl_zfs_pool }}/karakeep-data"
    mountpoint: "{{ irl_zfs_mount }}/karakeep-data"
    quota: "50G"
    properties:
      atime: "off"
      compression: "lz4"
  - name: "{{ irl_zfs_pool }}/karakeep-meilisearch"
    mountpoint: "{{ irl_zfs_mount }}/karakeep-meilisearch"
    quota: "20G"
    properties:
      atime: "off"
      compression: "lz4"

# ── NFS (hand-managed on homelab, not via ansible) ──────────────────
# The homelab already exports /media/root/storage1/nfs-share via NFSv4.2
# (set up manually, not via ansible). Laptop mounts at /mnt/homelab-nfs.
# Paperless-ngx piggybacks on this existing share: the consume directory
# lives at {{ irl_nfs_share_path }}/paperless-consume and the paperless pod
# mounts it via hostPath PV while the laptop writes via the existing NFS
# mount -- no new exports, no new mounts.
irl_nfs_share_path: "{{ irl_zfs_mount }}/nfs-share"
irl_paperless_consume_path: "{{ irl_nfs_share_path }}/paperless-consume"

# ── Domains ──────────────────────────────────────────────────────────
irl_public_domain: "lab.infiniteroomlabs.cloud"
irl_internal_domain: "internal.lab.infiniteroomlabs.cloud"

# ── Service subdomains (used in DNS records) ─────────────────────────
# Service dictionary. Used by CoreDNS zone template for DNS record generation.
# Routing is handled by Traefik IngressRoutes (in Helm charts or Ansible).
irl_services:
  gitea:
    subdomain: "git"
    internal: false
    cluster_svc: "gitea-http"
    cluster_port: 3000
  authentik:
    subdomain: "auth"
    internal: false
    cluster_svc: "authentik-server"
    cluster_port: 80
  grafana:
    subdomain: "grafana"
    internal: false
    cluster_svc: "monitoring-grafana"
    cluster_port: 80
  vault:
    subdomain: "vault"
    internal: false
    cluster_svc: "vault"
    cluster_port: 8200
  # jenkins:                   # SKIPPED -- plugin version incompatibility
  #   subdomain: "ci"
  #   internal: false
  prometheus:
    subdomain: "metrics"
    internal: true
    cluster_svc: "monitoring-kube-prometheus-prometheus"
    cluster_port: 9090
  alertmanager:
    subdomain: "alerts"
    internal: true
    cluster_svc: "monitoring-kube-prometheus-alertmanager"
    cluster_port: 9093
  garage:
    subdomain: "storage"
    internal: true
    cluster_svc: "garage-webui"
    cluster_port: 3909
  garage-s3:
    subdomain: "s3"
    internal: true
    cluster_only: true  # No external routing, cluster-internal only
  homepage:
    subdomain: "home"
    internal: false
    cluster_svc: "homepage"
    cluster_port: 3000
  vaultwarden:
    subdomain: "passwords"
    internal: false
    cluster_svc: "vaultwarden"
    cluster_port: 80
  openviking:
    subdomain: "context"
    internal: true
    cluster_svc: "openviking"
    cluster_port: 1933
  nextcloud:
    subdomain: "cloud"
    internal: false
    cluster_svc: "nextcloud"
    cluster_port: 8080
  paperless:
    subdomain: "archives"
    internal: false
    cluster_svc: "paperless"
    cluster_port: 8000
  firefly:
    subdomain: "finances"
    internal: false
    cluster_svc: "firefly"
    cluster_port: 80
  ghostfolio:
    subdomain: "portfolio"
    internal: false
    cluster_svc: "ghostfolio"
    cluster_port: 3333
  firefly-importer:
    subdomain: "import"
    internal: false
    cluster_svc: "firefly-importer"
    cluster_port: 80
  karakeep:
    subdomain: "bookmarks"
    internal: false
    cluster_svc: "karakeep"
    cluster_port: 3000
    health_path: "/api/health"
  # qbittorrent:                 # PAUSED -- DNS resolution blocker, see
  #   subdomain: "torrents"      # ~/projects/infinite-room-labs/qbittorrent-operator/deploy/irl/README.md
  #   internal: false            # Alpine/musl + k8s ndots:5 breaks tracker hostname resolution.
  #   cluster_svc: "qbittorrent" # Unblocker: add dnsConfig support to TorrentServer CRD in our fork.
  #   cluster_port: 8080         # Temporary: eXoDOS downloading on laptop instead.

# ── Users ────────────────────────────────────────────────────────────
irl_admin_user: "wes"
irl_admin_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII/2fedq5yEme4BIkc5FWmPoKi8cwnbPZRJ39SIxJrN9 deathnerd@wes-lenovo"

# ── Tailscale ────────────────────────────────────────────────────────
irl_tailscale_hostname: "homelab"

# ── PostgreSQL ───────────────────────────────────────────────────────
irl_pg_version: "16"
irl_pg_databases:
  - name: gitea
  - name: vault
  - name: authentik
  - name: grafana
  - name: vaultwarden
  - name: nextcloud
  - name: paperless
  - name: firefly
  - name: ghostfolio

# ── Traefik (in-cluster reverse proxy) ──────────────────────────────
irl_traefik_le_email: "admin@infiniteroomlabs.cloud"
# Services that need standalone IngressRoutes (no IRL-owned chart).
# Services with their own irl-* chart define IngressRoutes in the chart.
irl_traefik_standalone_services:
  authentik:
    subdomain: "auth"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "authentik-server"
    cluster_port: 80
  vault:
    subdomain: "vault"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "vault"
    cluster_port: 8200
  homepage:
    subdomain: "home"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "homepage"
    cluster_port: 3000
  vaultwarden:
    subdomain: "passwords"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "vaultwarden"
    cluster_port: 80
  nextcloud:
    subdomain: "cloud"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "nextcloud"
    cluster_port: 8080
  firefly:
    subdomain: "finances"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "firefly"
    cluster_port: 80
  ghostfolio:
    subdomain: "portfolio"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "ghostfolio"
    cluster_port: 3333
  firefly-importer:
    subdomain: "import"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "firefly-importer"
    cluster_port: 80
  karakeep:
    subdomain: "bookmarks"
    domain: "{{ irl_public_domain }}"
    cluster_svc: "karakeep"
    cluster_port: 3000

