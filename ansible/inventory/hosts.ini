# Infinite Room Labs -- Homelab Inventory
# =========================================
#
# Tailscale mesh is active. All access via Tailscale IP.
# LAN IP (192.168.2.2) is a fallback only.

[homelab]
homelab ansible_host=100.86.213.22

# LAN fallback (uncomment if Tailscale is down)
# homelab ansible_host=192.168.2.2

[homelab:vars]
ansible_user=wes
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

# Logical groupings for k3s roles
[k3s_server]
homelab

# Reserved, deliberately empty. The cloud agent node was retired; the k3s
# cluster is single-node until the KVM/libvirt VMs built by playbooks/vms.yml
# join as agents (docs/plans/2026-08-27-k3s-to-vms-migration-design.md).
# Keep the group: playbooks and tooling target it by name.
[k3s_agents]

# Personal laptop -- local automations only. Runs against THIS machine via
# connection=local (no SSH). Deliberately NOT part of site.yml; deploy with
# `uv run ansible-playbook playbooks/laptop.yml`.
[laptop]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
