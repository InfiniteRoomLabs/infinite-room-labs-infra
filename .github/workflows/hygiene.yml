name: hygiene

on:
  push:
    branches: [master]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      # Repo-introspection contract tests only: registry fan-out, secret-mapping
      # completeness, runbook coverage, docs encoding. No cluster or secret access.
      - name: Run hygiene suite
        run: uv run pytest -m hygiene
        working-directory: tests
        env:
          KUBECONFIG: /dev/null
