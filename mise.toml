# mise.toml -- tool versions + task runner for infinite-room-labs-infra.
#
# Secrets are NEVER loaded ambiently (no .envrc). They are injected per-command
# via `fnox exec`, wrapped by scripts/with-secrets.sh (which also supplies
# BW_SESSION). Run secret-needing work through the `mise run` tasks below, or
# ad-hoc with: `./scripts/with-secrets.sh <cmd>` / `fnox exec -- <cmd>`.
#
# Pinned versions are explicit (no "latest") per jdx policy. Bump deliberately.

[tools]
terraform  = "1.12.1"
packer     = "1.15.4"
terragrunt = "0.77.22"
helm       = "3.16.4"
kubectl    = "1.31.4"
task       = "3.49.1"
fnox       = "1.25.1"
usage      = "3.3.0"
age        = "1.3.1"   # required by the fnox age provider (BW_SESSION at rest)
"aqua:grafana/mcp-grafana" = "latest"

# Non-secret environment only. Anything sensitive lives in fnox, not here.
[env]
HOMELAB_TAILSCALE_IP = "100.86.213.22"
DO_SSH_FINGERPRINT   = "72:f4:34:64:4f:2b:39:5a:56:d4:e5:0a:65:91:d3:31"
IRL_SSH_PUBKEY       = "{{ exec(command='cat ~/.ssh/id_ed25519.pub') }}"
TAILSCALE_TAILNET    = "wes.gilleland@gmail.com"
GRAFANA_URL          = "https://grafana.lab.infiniteroomlabs.cloud"
# TODO(user): fill these two non-secret identifiers (see fnox.toml notes).
CLOUDFLARE_ACCOUNT_ID = "1897fe6f6e782d10f80056571f185391"
DOCKER_USERNAME       = "deathnerd"

[tasks.bootstrap]
description = "Bootstrap TFC workspaces + Cloudflare token (secrets via fnox)"
run = "./scripts/with-secrets.sh ./scripts/bootstrap.sh"

[tasks."secrets:sync"]
description = "Sync Bitwarden -> ansible vault + k8s secrets"
run = "./scripts/with-secrets.sh ./scripts/bw-sync.sh --target both"

[tasks."secrets:check"]
description = "Report secrets past their rotation deadline"
run = "./scripts/with-secrets.sh ./scripts/bw-sync.sh --check-rotation"

[tasks."secrets:verify-k8s"]
description = "Verify k8s secrets match Bitwarden"
run = "./scripts/with-secrets.sh ./scripts/bw-sync.sh --verify-k8s"

[tasks.ansible]
description = "Ansible Docker wrapper -- e.g. mise run ansible -- playbook site.yml"
run = "./scripts/with-secrets.sh ./ansible/run-ansible.sh"

[tasks."test:smoke"]
description = "Quick health-check smoke tests"
dir = "tests"
run = "task smoke"

[tasks."test:validate"]
description = "Full acceptance pipeline (goss + pytest + report)"
dir = "tests"
run = "task validate"
