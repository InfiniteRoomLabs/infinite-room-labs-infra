# scripts/bw-sync-config.yaml
# Mapping file for bw-sync.sh -- defines where each Bitwarden item gets written.
# The "IRL" folder in Bitwarden is the root; all items here live under that folder.
#
# Per-secret fields:
#   bw_item        (required) Bitwarden item name to read the value from.
#   ansible_var    (optional) Dotted var path written into the Ansible vault.
#   k8s_secret     (optional) Kubernetes Secret name; null disables the k8s sync.
#   k8s_key        (optional) Key inside that Secret.
#   k8s_namespace  (optional) Namespace for this secret. Omit to fall back to
#                  targets.kubernetes.namespace (the default below). Secrets
#                  with the same k8s_secret name but different namespaces are
#                  kept separate -- they are NOT merged into one Secret.

bitwarden_folder: "IRL"

targets:
  ansible_vault:
    output_file: "ansible/inventory/group_vars/all/vault.yml"
    encryption_password_item: "ansible-vault-password"
  kubernetes:
    # Default namespace for any secret that does not set its own k8s_namespace.
    namespace: "irl"
    kubeconfig: "~/.kube/homelab.yaml"

secrets:
  - bw_item: "pg-superuser"
    ansible_var: "vault_pg_superuser_password"
    k8s_secret: "postgres-superuser"
    k8s_key: "postgres-password"

  - bw_item: "pg-gitea"
    ansible_var: "vault_pg_passwords.gitea"
    k8s_secret: "postgres-gitea"
    k8s_key: "password"

  - bw_item: "pg-vault"
    ansible_var: "vault_pg_passwords.vault"
    k8s_secret: "postgres-vault"
    k8s_key: "password"

  - bw_item: "pg-authentik"
    ansible_var: "vault_pg_passwords.authentik"
    k8s_secret: "postgres-authentik"
    k8s_key: "password"

  - bw_item: "pg-grafana"
    ansible_var: "vault_pg_passwords.grafana"
    k8s_secret: "postgres-grafana"
    k8s_key: "password"

  - bw_item: "redis-auth"
    ansible_var: "vault_redis_password"
    k8s_secret: "redis-auth"
    k8s_key: "redis-password"

  - bw_item: "gitea-admin"
    ansible_var: "vault_gitea_admin_password"
    k8s_secret: "gitea-admin"
    k8s_key: "password"

  - bw_item: "authentik-admin"
    ansible_var: "vault_authentik_bootstrap_password"
    k8s_secret: "authentik-bootstrap"
    k8s_key: "bootstrap-password"

  - bw_item: "authentik-secret-key"
    ansible_var: "vault_authentik_secret_key"
    k8s_secret: "authentik-bootstrap"
    k8s_key: "secret-key"

  # Deluge BitTorrent daemon admin password (host-only service, no k8s secret).
  # Consumed by ansible/playbooks/deluge.yml for the auth file entry.
  - bw_item: "deluge-admin"
    ansible_var: "vault_deluge_admin_password"

  - bw_item: "grafana-admin"
    ansible_var: "vault_grafana_admin_password"
    k8s_secret: "grafana-admin"
    k8s_key: "admin-password"

  - bw_item: "garage-rpc-secret"
    ansible_var: "vault_garage_rpc_secret"
    k8s_secret: "garage-rpc-secret"
    k8s_key: "rpc-secret"

  - bw_item: "garage-admin-token"
    ansible_var: "vault_garage_admin_token"
    k8s_secret: "garage-admin-secret"
    k8s_key: "admin-token"

  - bw_item: "garage-metrics-token"
    ansible_var: "vault_garage_metrics_token"
    k8s_secret: "garage-admin-secret"
    k8s_key: "metrics-token"

  - bw_item: "openviking-api-key"
    ansible_var: "vault_openviking_api_key"
    k8s_secret: "openviking-api-key"
    k8s_key: "root-api-key"

  - bw_item: "homepage-gitea-token"
    ansible_var: "vault_homepage_gitea_token"
    k8s_secret: "homepage-api-keys"
    k8s_key: "gitea-token"

  - bw_item: "homepage-authentik-key"
    ansible_var: "vault_homepage_authentik_token"
    k8s_secret: "homepage-api-keys"
    k8s_key: "authentik-token"

  - bw_item: "tailscale-api-key"
    ansible_var: "vault_tailscale_api_key"
    k8s_secret: null
    k8s_key: null

  - bw_item: "ansible-vault-password"
    ansible_var: "vault_ansible_vault_password"
    k8s_secret: null
    k8s_key: null

  # ── Paperless-ngx (document management) ──────────────────────
  - bw_item: "pg-paperless"
    ansible_var: "vault_pg_passwords.paperless"
    k8s_secret: "postgres-paperless"
    k8s_key: "password"

  - bw_item: "paperless-secret-key"
    ansible_var: "vault_paperless_secret_key"
    k8s_secret: "paperless-secrets"
    k8s_key: "secret-key"

  - bw_item: "paperless-admin"
    ansible_var: "vault_paperless_admin_password"
    k8s_secret: "paperless-secrets"
    k8s_key: "admin-password"

  # Authentik OIDC provider bundle (app slug "paperless", provider_id "authentik")
  - bw_item: "paperless-oidc-client-id"
    ansible_var: "vault_paperless_oidc_client_id"
    k8s_secret: "paperless-oidc"
    k8s_key: "client-id"

  - bw_item: "paperless-oidc-client-secret"
    ansible_var: "vault_paperless_oidc_client_secret"
    k8s_secret: "paperless-oidc"
    k8s_key: "client-secret"

  # Rendered PAPERLESS_SOCIALACCOUNT_PROVIDERS JSON embedding the two above
  - bw_item: "paperless-socialaccount-providers"
    ansible_var: "vault_paperless_socialaccount_providers_json"
    k8s_secret: "paperless-secrets"
    k8s_key: "PAPERLESS_SOCIALACCOUNT_PROVIDERS"

  # Garage S3 IAM keys for the paperless-backups bucket (CronJob uploader)
  - bw_item: "paperless-backup-s3-access-key"
    ansible_var: "vault_paperless_backup_s3_access_key"
    k8s_secret: "paperless-backup-s3"
    k8s_key: "AWS_ACCESS_KEY_ID"

  - bw_item: "paperless-backup-s3-secret-key"
    ansible_var: "vault_paperless_backup_s3_secret_key"
    k8s_secret: "paperless-backup-s3"
    k8s_key: "AWS_SECRET_ACCESS_KEY"

  # REST API token used by playbooks/paperless-config.yml to apply taxonomy +
  # workflows. Value = the existing ~/.secrets/.paperless-api-token (also used by
  # the paperless MCP wrapper) -- no new token minted.
  - bw_item: "paperless-api-token"
    ansible_var: "vault_paperless_api_token"
    k8s_secret: "paperless-secrets"
    k8s_key: "api-token"

  # ── Firefly III (personal finance ledger) ───────────────────
  - bw_item: "pg-firefly"
    ansible_var: "vault_pg_passwords.firefly"
    k8s_secret: "postgres-firefly"
    k8s_key: "password"

  # 32-char APP_KEY -- Firefly encrypts data with this; losing/changing it
  # makes existing encrypted fields unreadable. Generate exactly 32 chars.
  - bw_item: "firefly-app-key"
    ansible_var: "vault_firefly_app_key"
    k8s_secret: "firefly-secrets"
    k8s_key: "APP_KEY"

  # Firefly PAT used by the Data Importer (reuses the same token as the MCP).
  - bw_item: "firefly-importer-token"
    ansible_var: "vault_firefly_importer_token"
    k8s_secret: "firefly-importer-secrets"
    k8s_key: "accessToken"

  # ── Ghostfolio (investment portfolio) ───────────────────────
  - bw_item: "pg-ghostfolio"
    ansible_var: "vault_pg_passwords.ghostfolio"
    k8s_secret: "postgres-ghostfolio"
    k8s_key: "password"

  - bw_item: "ghostfolio-access-token-salt"
    ansible_var: "vault_ghostfolio_access_token_salt"
    k8s_secret: "ghostfolio-secrets"
    k8s_key: "ACCESS_TOKEN_SALT"

  - bw_item: "ghostfolio-jwt-secret"
    ansible_var: "vault_ghostfolio_jwt_secret"
    k8s_secret: "ghostfolio-secrets"
    k8s_key: "JWT_SECRET_KEY"

  # ── Karakeep (bookmarks) ────────────────────────────────────
  # Split into two Secrets: the meilisearch chart envFroms its entire
  # secret, so a shared one would leak NEXTAUTH_SECRET into that pod.
  - bw_item: "karakeep-nextauth-secret"
    ansible_var: "vault_karakeep_nextauth_secret"
    k8s_secret: "karakeep-secrets"
    k8s_key: "NEXTAUTH_SECRET"

  - bw_item: "karakeep-meili-master-key"
    ansible_var: "vault_karakeep_meili_master_key"
    k8s_secret: "karakeep-meili-secrets"
    k8s_key: "MEILI_MASTER_KEY"

  # ── Vaultwarden (password manager) ─────────────────────────
  - bw_item: "pg-vaultwarden"
    ansible_var: "vault_pg_passwords.vaultwarden"
    k8s_secret: "postgres-vaultwarden"
    k8s_key: "password"

  - bw_item: "vaultwarden-admin-token"
    ansible_var: "vault_vaultwarden_admin_token"
    k8s_secret: "vaultwarden-admin"
    k8s_key: "admin-token"

  # ── Nextcloud (file sharing) ──────────────────────────────────
  - bw_item: "pg-nextcloud"
    ansible_var: "vault_pg_passwords.nextcloud"
    k8s_secret: "postgres-nextcloud"
    k8s_key: "password"

  - bw_item: "nextcloud-admin"
    ansible_var: "vault_nextcloud_admin_password"
    k8s_secret: null
    k8s_key: null

  # ── Traefik (in-cluster reverse proxy) ────────────────────────
  - bw_item: "cloudflare-caddy-dns01-token"
    ansible_var: "vault_cloudflare_traefik_dns01_token"
    k8s_secret: "traefik-cloudflare-token"
    k8s_key: "api-token"

  # ── SendGrid (transactional email) ──────────────────────────
  - bw_item: "sendgrid-api-key"
    ansible_var: "vault_sendgrid_api_key"
    k8s_secret: "sendgrid-credentials"
    k8s_key: "api-key"

  - bw_item: "sendgrid-mail-send-key"
    ansible_var: "vault_sendgrid_mail_send_key"
    k8s_secret: "sendgrid-credentials"
    k8s_key: "mail-send-key"

  # ── Gemini (Google AI) ──────────────────────────────────────
  - bw_item: "gemini-api-key"
    ansible_var: "vault_gemini_api_key"
    k8s_secret: "gemini-api-key"
    k8s_key: "api-key"

  # ── Palworld (game server RCON admin) ───────────────────────
  # Consumed as env ADMIN_PASSWORD by the irl-palworld chart; RCON is what
  # makes SIGTERM saves and the daily auto-reboot graceful.
  - bw_item: "palworld-admin-password"
    ansible_var: "vault_palworld_admin_password"
    k8s_secret: "palworld-secrets"
    k8s_key: "ADMIN_PASSWORD"

  # ── JobOps (separate namespace: "jobops") ───────────────────
  # Example shape for secrets that must land in the "jobops" namespace instead
  # of the default "irl". Uncomment and replace the placeholder bw_item names
  # with the real Bitwarden item names once they exist.
  # - bw_item: "REPLACE-jobops-db-password"
  #   ansible_var: "vault_jobops_db_password"
  #   k8s_secret: "jobops-postgres"
  #   k8s_key: "password"
  #   k8s_namespace: "jobops"
  #
  # - bw_item: "REPLACE-jobops-api-key"
  #   ansible_var: "vault_jobops_api_key"
  #   k8s_secret: "jobops-secrets"
  #   k8s_key: "api-key"
  #   k8s_namespace: "jobops"
